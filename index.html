  function currentLogoSrc() {
    const st = (S && S.settings) || {};
    const theme = (typeof resolvedTheme === 'function')
      ? resolvedTheme()
      : (document.documentElement.getAttribute('data-theme') || 'light');
    if (theme === 'dark') return st.logoDataDark || st.logoData || null;
    return st.logoData || st.logoDataDark || null;
  }
  function logoSizePx() {
    return Math.max(16, Math.min(128, +(S?.settings?.logoSize || 28)));
  }
  function titleSizePx() {
    return Math.max(12, Math.min(48, +(S?.settings?.titleSize || 17)));
  }
  function orgSizePx() {
    return Math.max(10, Math.min(32, +(S?.settings?.orgSize || 13)));
  }
  function applyBrandSizes() {
    const mobile = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
    // En móvil: logo/textos más legibles; no heredar tamaños extremos de PC
    const ls = mobile ? Math.min(Math.max(logoSizePx(), 52), 56) : logoSizePx();
    const ts = mobile ? Math.min(Math.max(titleSizePx(), 20), 22) : titleSizePx();
    const os = mobile ? Math.min(Math.max(orgSizePx(), 14), 15) : orgSizePx();
    const root = document.documentElement;
    root.style.setProperty('--logo-size', ls + 'px');
    root.style.setProperty('--title-size', ts + 'px');
    root.style.setProperty('--org-size', os + 'px');
    root.style.setProperty('--nav-h', mobile ? 'auto' : (Math.max(56, ls + 28) + 'px'));
    document.querySelectorAll('.brand .logo-img').forEach(img => {
      img.style.width = ls + 'px';
      img.style.height = ls + 'px';
      img.style.maxWidth = ls + 'px';
      img.style.maxHeight = ls + 'px';
      img.setAttribute('width', String(ls));
      img.setAttribute('height', String(ls));
    });
    document.querySelectorAll('.brand .brand-title').forEach(el => {
      el.style.fontSize = ts + 'px';
      el.style.fontFamily = 'var(--font-brand, Inter, sans-serif)';
      el.style.whiteSpace = 'nowrap';
      el.style.overflow = 'hidden';
      el.style.textOverflow = 'ellipsis';
      el.style.maxWidth = '100%';
      el.style.width = 'auto';
      el.style.writingMode = 'horizontal-tb';
    });
    document.querySelectorAll('.brand .brand-org').forEach(el => {
      el.style.fontSize = os + 'px';
      el.style.fontFamily = 'var(--font-brand, Inter, sans-serif)';
      el.style.color = 'var(--text-3)';
      el.style.display = 'block';
      el.style.whiteSpace = 'nowrap';
      el.style.overflow = 'hidden';
      el.style.textOverflow = 'ellipsis';
      el.style.maxWidth = '100%';
    });
  }
  if (typeof window !== 'undefined' && !window.__brandMobileResize) {
    window.__brandMobileResize = true;
    window.addEventListener('resize', () => { try { applyBrandSizes(); } catch (e) {} });
  }

  function LOGO_HTML() {
    const src = currentLogoSrc();
    if (!src) return '';
    const sz = logoSizePx();
    return `<img class="logo-img" src="${src}" alt="${esc(S?.settings?.appName || 'Cyper')}" width="${sz}" height="${sz}" style="width:${sz}px;height:${sz}px"/>`;
  }
  function LOGO_BIG_HTML() {
    const src = currentLogoSrc();
    if (src) return `<img class="logo-full" src="${src}" alt="${esc(S.settings.appName || 'Cyper')}"/>`;
    return '';
  }
  function applyLogoFavicon() {
    const l = document.querySelector('link[rel=icon]');
    if (!l) return;
    const src = currentLogoSrc();
    if (src) { l.type = 'image/png'; l.href = src; }
  }
  applyBrandSizes();
  applyLogoFavicon();

  /* ---------------- Modales ---------------- */
  function openModal({ title, sub = '', body = '', foot = '', size = '', icon = '', onMount, onClose, dismissable = true }) {
    const root = document.createElement('div');
    root.className = 'modal-root';
    root.innerHTML = `<div class="modal-backdrop"></div>
      <div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        ${title ? `<div class="modal-head">${icon}<div><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div>
        <button class="icon-btn" data-close aria-label="Cerrar">${ic('x')}</button></div>` : ''}
        <div class="modal-body">${body}</div>
        ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
      </div>`;
    $('#modals').appendChild(root);
    const m = $('.modal', root);
    let closed = false;
    const close = () => {
      if (closed) return; closed = true;
      root.classList.add('closing'); m.classList.add('closing');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => { root.remove(); onClose && onClose(); }, 240);
    };
    const onKey = (e) => {
      if (root !== $('#modals').lastElementChild) return;
      if (e.key === 'Escape' && dismissable) { e.preventDefault(); close(); return; }
      if (e.key !== 'Enter' || e.isComposing) return;
      // No interceptar Enter en textarea (salvo Ctrl/Cmd+Enter) ni en botones que ya manejan su clic
      const t = e.target;
      if (t && t.tagName === 'TEXTAREA' && !(e.ctrlKey || e.metaKey)) return;
      if (t && t.tagName === 'BUTTON' && t.matches('[data-close]')) return;
      // Preferir data-ok; si no, el botón primario o de peligro del pie
      const okBtn = m.querySelector('[data-ok]')
        || m.querySelector('[data-save]')
        || m.querySelector('.modal-foot .btn-primary')
        || m.querySelector('.modal-foot .btn-danger');
      if (!okBtn || okBtn.disabled) return;
      e.preventDefault();
      okBtn.click();
    };
    document.addEventListener('keydown', onKey);
    $('.modal-backdrop', root).addEventListener('click', () => dismissable && close());
    $$('[data-close]', root).forEach(b => b.addEventListener('click', close));
    icons();
    const ctx = { root, el: m, close, $: (s) => $(s, m), $$: (s) => $$(s, m) };
    onMount && onMount(ctx);
    setTimeout(() => { const f = $('input:not([type=hidden]):not([readonly]):not([type=checkbox]):not([type=radio]), textarea', m); f && f.focus(); }, 80);
    return ctx;
  }

  function confirmDialog({ title, text, ok = 'Confirmar', danger = false }) {
    return new Promise(res => {
      let answered = false;
      openModal({
        title, sub: text,
        foot: `<button class="btn btn-secondary" data-close>Cancelar</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${ok}</button>`,
        onMount: (c) => c.$('[data-ok]').addEventListener('click', () => { answered = true; res(true); c.close(); }),
        onClose: () => !answered && res(false),
      });
    });
  }

  /* Menú contextual */
  function openMenu(anchor, items) {
    closeMenu();
    const r = anchor.getBoundingClientRect();
    const m = document.createElement('div');
    m.className = 'ctx';
    m.innerHTML = `<div class="dropdown" style="position:static;min-width:210px">${items.map((it, i) => it === '-' ? '<div style="height:1px;background:var(--line);margin:6px 4px"></div>'
      : `<button class="dropdown-item ${it.danger ? 'danger' : ''}" data-i="${i}">${ic(it.icon)}${esc(it.label)}</button>`).join('')}</div>`;
    document.body.appendChild(m);
    const w = 220; const left = Math.min(r.right - w, innerWidth - w - 12);
    m.style.left = Math.max(12, left) + 'px';
    const top = r.bottom + 6; m.style.top = (top + m.offsetHeight > innerHeight ? r.top - m.offsetHeight - 6 : top) + 'px';
    icons();
    m.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { closeMenu(); items[+b.dataset.i].run(); } });
    setTimeout(() => document.addEventListener('click', closeMenu, { once: true }), 0);
  }
  function closeMenu() { $$('.ctx').forEach(x => x.remove()); }

  /* ---------------- Render principal ---------------- */
  function render() {
    closeMenu();
    const app = $('#app');
    if (!S) { app.innerHTML = setupView(); bindSetup(); icons(); return; }
    if (!me) { app.innerHTML = loginView(); bindLogin(); icons(); return; }
    let content = '';
    if (route.view === 'home') content = homeView();
    else if (route.view === 'unit') content = unitView();
    else if (route.view === 'area') content = areaView();
    else if (route.view === 'folder') content = folderView();
    else if (route.view === 'dashboard') content = dashboardView();
    else if (route.view === 'matrix') content = matrixView();
    else if (route.view === 'settings') content = settingsView();
    else if (route.view === 'search') content = searchView();
    app.innerHTML = navView() + `<main class="main"><div class="view" id="view">${content}</div></main>`;
    applyBrandSizes();
    applyLogoFavicon();
    icons();
    bindView();
    saveRoute();
    touchSessionActivity();
    updateSessionCountdown();
  }

  function go(view, params = {}) {
    Object.assign(route, { view }, params);
    saveRoute();
    render();
    scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------------- Login ---------------- */
  function loginView() {
    const st = S.settings;
    return `<div class="login">
      <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
      <form class="login-card" id="loginForm" novalidate>
        <div class="login-brand">
          ${LOGO_BIG_HTML() ? `<div class="logo-big">${LOGO_BIG_HTML()}</div>` : ''}
          <h1>${esc(st.appName)}</h1>
        </div>
        <div class="login-fade">
          <p>${st.orgName ? esc(st.orgName) : ''}</p>
          <div class="field"><label for="lEmail">Correo corporativo</label>
            <input class="input" id="lEmail" type="email" autocomplete="username" placeholder="nombre@${esc(st.domains[0] || 'empresa.com')}" required /></div>
          <div class="field"><label for="lPass">Contraseña</label>
            <div class="input-icon"><input class="input" id="lPass" type="password" autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="icon-btn" data-toggle-pass aria-label="Mostrar contraseña">${ic('eye')}</button></div></div>
          <div class="err hidden" id="lErr" style="color:var(--danger);font-size:13px;margin:-4px 0 12px;text-align:left"></div>
          <button class="btn btn-primary btn-lg" type="submit">Iniciar sesión ${ic('arrow-right')}</button>
          <div class="demo-users" style="text-align:center">¿Olvidaste tu contraseña? Solicita a un administrador que la restablezca.</div>
        </div>
      </form></div>`;
  }
  function playLoginZoom() {
    return new Promise((resolve) => {
      const root = document.querySelector('.login');
      if (!root || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        resolve();
        return;
      }
      // Fija el punto de origen del zoom en el centro visual del brand antes de animar
      const brand = root.querySelector('.login-brand');
      if (brand) {
        const r = brand.getBoundingClientRect();
        brand.style.left = (r.left + r.width / 2) + 'px';
        brand.style.top = (r.top + r.height / 2) + 'px';
      }
      root.classList.add('zooming');
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        resolve();
      };
      if (brand) brand.addEventListener('animationend', finish, { once: true });
      setTimeout(finish, 1000);
    });
  }

  const EMAIL_RE = /^[a-z0-9._%+-]+@[a-z0-9-]+(\.[a-z0-9-]+)+$/;

  function bindSetup() {
    const f = $('#setupForm');
    $$('[data-toggle-pass]').forEach(btn => {
  btn.addEventListener('click', () => togglePass(btn, btn.closest('.input-icon').querySelector('input')));
});
    $('#sUser').addEventListener('input', (e) => { e.target.value = e.target.value.toLowerCase().replace(/\s/g, ''); });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = (m, el) => { const x = $('#sErr'); x.textContent = m; x.classList.remove('hidden'); el && el.classList.add('invalid'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); };
      $$('.invalid', f).forEach(x => x.classList.remove('invalid'));
      const email = $('#sUser').value.trim().toLowerCase();
      const name = $('#sName').value.trim();

      const min = defaultSettings().minPassword;
      if (!name) return err('Escribe el nombre del administrador', $('#sName'));
      if (!EMAIL_RE.test(email)) return err('Escribe un correo válido para el administrador', $('#sUser'));
      const polErr = passPolicyError(pass, min);
      if (polErr) return err(polErr, $('#sPass'));
      if (pass !== pass2) return err('Las contraseñas no coinciden', $('#sPass2'));
      const btn = $('button[type=submit]', f); btn.disabled = true; btn.textContent = 'Creando…';
      await Repo.init({ email, name, pass });
      S = Repo.db; migrate(); me = S.users[0]; SessionStore.setItem(SESSION, me.id); me.lastLogin = now(); save();
      applyTheme(); go('home'); toast('Repositorio creado');
    });

  const loginLock = { fails: 0, until: 0 };
  function bindLogin() {
    const f = $('#loginForm');
    $('[data-toggle-pass]').addEventListener('click', (e) => togglePass(e.currentTarget, $('#lPass')));
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#lEmail').value.trim().toLowerCase();
      const pass = $('#lPass').value;
      const err = (m) => { const x = $('#lErr'); x.textContent = m; x.classList.remove('hidden'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); };
      if (!EMAIL_RE.test(email)) return err('Escribe un correo válido');
      const u = S.users.find(x => x.email === email);
      if (loginLock.until > now()) return err(`Demasiados intentos. Espera ${Math.ceil((loginLock.until - now()) / 1000)} s.`);
      if (!u || !(await Repo.verifyPassword(pass, u.pass))) {
        loginLock.fails++;
        if (loginLock.fails >= 5) { loginLock.until = now() + 30000; loginLock.fails = 0; }
        return err('Correo o contraseña incorrectos');
      }
      loginLock.fails = 0;
      if (!u.active) return err('Esta cuenta está desactivada. Contacta al administrador.');
      me = u; SessionStore.setItem(SESSION, u.id);
      u.lastLogin = now(); log('acceso', `Inicio de sesión`); save();
      try { touchSessionActivity(); startSessionWatch(); } catch (e) {}
      const nombre = (u.name || '').trim() || 'usuario';
      const h = new Date().getHours();
      const saludo = h < 12 ? 'buenos días' : h < 19 ? 'buenas tardes' : 'buenas noches';
      const btn = f.querySelector('button[type=submit]');
      if (btn) { btn.disabled = true; btn.textContent = 'Entrando…'; }
      await playLoginZoom();
      go('home');
      setTimeout(() => toast(`Hola ${nombre}, ${saludo}`), 350);
    });
  }
  function togglePass(btn, input) {

    icons();
  }

  /* ---------------- Pestaña Dashboard ---------------- */
  function toggleTableColSort(which, col) {
    const key = which === 'folder' ? 'folderColSort' : 'matrixColSort';
    if (!ui[key]) ui[key] = { col: null, dir: 'asc' };
    if (ui[key].col === col) ui[key].dir = ui[key].dir === 'asc' ? 'desc' : 'asc';
    else ui[key] = { col, dir: 'asc' };
    ui.colSortMark = which;
    try {
      const store = window.LocalStore || localStorage;
      store.setItem('cyper_col_sort', JSON.stringify({
        matrixColSort: ui.matrixColSort || { col: null, dir: 'asc' },
        folderColSort: ui.folderColSort || { col: null, dir: 'asc' },
      }));
    } catch (e) {}
  }
  function cmpColSort(va, vb, dir) {
    const mul = dir === 'desc' ? -1 : 1;
    if (va == null || va === '' || (typeof va === 'number' && isNaN(va))) {
      if (vb == null || vb === '' || (typeof vb === 'number' && isNaN(vb))) return 0;
      return 1;
    }
    if (vb == null || vb === '' || (typeof vb === 'number' && isNaN(vb))) return -1;
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * mul;
    return String(va).localeCompare(String(vb), 'es', { numeric: true, sensitivity: 'base' }) * mul;
  }
  function matrixColValue(d, col) {
    const a = areaById(d.areaId), f = folderById(d.folderId), u = unitById(a?.unitId);
    switch (col) {
      case 0: return u?.name || '';
      case 1: return d.nomenclatura || '';
      case 2: return d.nombre || '';
      case 3: return d.macroproceso || '';
      case 4: return a?.name || '';
      case 5: return f?.name || '';
      case 6: return d.tipo || '';
      case 7: return d.categoria || '';
      case 8: return d.clasificacion || '';
      case 9: { const n = parseFloat(String(d.version ?? '').replace(/[^0-9.-]/g, '')); return isNaN(n) ? null : n; }
      case 10: return d.fechaEmision ? Date.parse(d.fechaEmision) : null;
      case 11: return d.updatedAt || (d.fechaActualizacion ? Date.parse(d.fechaActualizacion) : null);
      case 12: return d.fechaAutorizacion ? Date.parse(d.fechaAutorizacion) : null;
      case 13: return d.fechaDifusion ? Date.parse(d.fechaDifusion) : null;
      case 14: return d.url || '';
      case 15: return d.rectorId ? (docById(d.rectorId)?.nomenclatura || '') : '';
      case 16: return (typeof estadoLabel === 'function' ? estadoLabel(computeEstado(d)) : computeEstado(d)) || '';
      default: return '';
    }
  }
  function folderColValue(d, col) {
    const a = areaById(d.areaId), f = folderById(d.folderId);
    switch (col) {
      case 0: return (d.ext || '').toLowerCase();
      case 1: return `${d.nomenclatura || ''} ${d.nombre || ''}`;
      case 2: return d.nomenclatura || '';
      case 3: return d.nombre || '';
      case 4: return d.macroproceso || '';
      case 5: return a?.name || '';
      case 6: return f?.name || '';
      case 7: return d.tipo || '';
      case 8: return d.categoria || '';
      case 9: return d.clasificacion || '';
      case 10: { const n = parseFloat(String(d.version ?? '').replace(/[^0-9.-]/g, '')); return isNaN(n) ? null : n; }
      case 11: return d.fechaEmision ? Date.parse(d.fechaEmision) : null;
      case 12: return d.updatedAt || (d.fechaActualizacion ? Date.parse(d.fechaActualizacion) : null);
      case 13: return d.fechaAutorizacion ? Date.parse(d.fechaAutorizacion) : null;
      case 14: return d.fechaDifusion ? Date.parse(d.fechaDifusion) : null;
      case 15: return (typeof estadoLabel === 'function' ? estadoLabel(computeEstado(d)) : computeEstado(d)) || '';
      default: return '';
    }
  }
  function sortDocsByCol(docs, which) {
    const st = which === 'folder' ? ui.folderColSort : ui.matrixColSort;
    if (!st || st.col == null) return docs;
    const getter = which === 'folder' ? folderColValue : matrixColValue;
    const col = st.col, dir = st.dir || 'asc';
    return docs.slice().sort((a, b) => cmpColSort(getter(a, col), getter(b, col), dir));
  }

  function bindMatrix() {
    const refresh = () => { $('#view').innerHTML = matrixView(); icons(); bindMatrix();  };
    $$('#matrixTbl .th-sort[data-sort-col]').forEach(el => {
      if (el.dataset.sortBound) return;
      el.dataset.sortBound = '1';
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        toggleTableColSort('matrix', +el.dataset.sortCol);
        refresh();
      });
    });
    // (acts globales via document click)
    const rebindClick = () => {
      $$('#view [data-act]').forEach(el => {
        if (el.dataset.matrixBound) return;
        el.dataset.matrixBound = '1';
      });
    };
    ['mfUnit','mfArea','mfYear','mfCat','mfTipo'].forEach(id => {
      const el = $('#' + id);
      if (!el) return;
      el.addEventListener('change', () => {
        ui.matrixDash = ui.matrixDash || {};
        const map = { mfUnit: 'unit', mfArea: 'area', mfYear: 'year', mfCat: 'cat', mfTipo: 'tipo' };
        ui.matrixDash[map[id]] = el.value;
        // Cascada: limpiar dependientes
        if (id === 'mfUnit') { ui.matrixDash.area = ''; ui.matrixDash.year = ''; }
        if (id === 'mfArea') ui.matrixDash.year = '';
        $('#view').innerHTML = matrixView(); icons(); bindMatrix();
        // re-attach global acts
        if (typeof bindView === 'function') { /* acts via delegation below */ }
        bindMatrixActs();
      });
    });
    $('#mfClear')?.addEventListener('click', () => {
      ui.matrixDash = { unit: '', area: '', year: '', cat: '', tipo: '' };
      ui.matrixColFilters = {};
      $('#view').innerHTML = matrixView(); icons(); bindMatrix(); bindMatrixActs();
    });
    $('#matrixXlsx')?.addEventListener('click', () => exportMatrixXlsx());
    $('#matrixSelBtn')?.addEventListener('click', async () => {
      if (!ui.matrixSelected) ui.matrixSelected = new Set();
      if (!ui.matrixSelectMode) {
        ui.matrixSelectMode = true;
        $('#view').innerHTML = matrixView(); icons(); bindMatrix(); 
        return;
      }
      if (!ui.matrixSelected.size) {
        ui.matrixSelectMode = false;
        $('#view').innerHTML = matrixView(); icons(); bindMatrix(); 
        return;
      }
      const docs = [...ui.matrixSelected].map(id => docById(id)).filter(Boolean);
      await downloadDocsBulk(docs, 'matriz-seleccion');
    });
    $('#matrixMoveBtn')?.addEventListener('click', () => {
      if (!ui.matrixSelected || !ui.matrixSelected.size) return;
      const docs = [...ui.matrixSelected].map(id => docById(id)).filter(Boolean);
      moveDocsModal(docs);
    });
    $('#matrixDelBtn')?.addEventListener('click', async () => {
      if (!ui.matrixSelected || !ui.matrixSelected.size) return;
      const docs = [...ui.matrixSelected].map(id => docById(id)).filter(Boolean);
      await deleteDocsBulk(docs);
    });
    $('#matrixBody')?.addEventListener('change', (e) => {
      const cb = e.target.closest('.matrix-sel');
      if (!cb) return;
      if (!ui.matrixSelected) ui.matrixSelected = new Set();
      if (cb.checked) ui.matrixSelected.add(cb.dataset.id);
      else ui.matrixSelected.delete(cb.dataset.id);
      const tr = cb.closest('tr');
      if (tr) tr.classList.toggle('row-selected', cb.checked);
      const n = ui.matrixSelected.size;
      const btn = $('#matrixSelBtn');
      if (btn) {
        btn.innerHTML = n
          ? `${ic('download')}Descargar (${n})`
          : (ui.matrixSelectMode ? `${ic('x')}Cancelar selección` : `${ic('check-square')}Seleccionar`);
      }
      const mv = $('#matrixMoveBtn');
      if (mv) {
        mv.disabled = !n;
        mv.innerHTML = `${ic('folder-input')}Mover o copiar${n ? ` (${n})` : ''}`;
      }
      const del = $('#matrixDelBtn');
      if (del) {
        del.disabled = !n;
        del.innerHTML = `${ic('trash-2')}Eliminar${n ? ` (${n})` : ''}`;
      }
      icons();
    });
    enableResizableColumns('#matrixTbl');
    // Excel-like column filters
    if (!ui.matrixColFilters) ui.matrixColFilters = {};
    const applyColFilters = () => {
      const filters = ui.matrixColFilters || {};
      let n = 0;
      $$('#matrixBody tr').forEach(tr => {
        let cells;
        try { cells = JSON.parse(decodeURIComponent(tr.getAttribute('data-cells') || '%5B%5D')); } catch { cells = []; }
        let ok = true;
        Object.keys(filters).forEach(ci => {
          const set = filters[ci];
          if (!set || !set.size) return;
          const val = String(cells[+ci] ?? '');
          if (!set.has(val)) ok = false;
        });
        tr.style.display = ok ? '' : 'none';
        if (ok) n++;
      });
      const c = $('#matrixCount'); if (c) c.textContent = n;
    };
    $$('[data-col-filter]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const col = +btn.dataset.colFilter;
        // Close other popovers
        $$('.col-filter-pop').forEach(p => p.remove());
        const values = new Set();
        $$('#matrixBody tr').forEach(tr => {
          try {
            const cells = JSON.parse(decodeURIComponent(tr.getAttribute('data-cells') || '%5B%5D'));
            values.add(String(cells[col] ?? ''));
          } catch {}
        });
        const sorted = [...values].sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));
        const selected = ui.matrixColFilters[col] || new Set(sorted);
        const pop = document.createElement('div');
        pop.className = 'col-filter-pop';
        pop.innerHTML = `
          <div class="cf-search"><input class="input" type="search" placeholder="Buscar…" id="cfSearch"/></div>
          <div class="cf-actions">
            <button type="button" class="btn-ghost btn btn-sm" data-cf-all>Seleccionar todo</button>
            <button type="button" class="btn-ghost btn btn-sm" data-cf-none>Deseleccionar todo</button>
          </div>
          <div class="cf-list" id="cfList">${sorted.map(v => {
            const checked = selected.has(v) ? 'checked' : '';
            return `<label class="cf-item"><input type="checkbox" value="${esc(v)}" ${checked}/><span title="${esc(v)}">${esc(v || '(vacío)')}</span></label>`;
          }).join('')}</div>
          <div class="cf-foot">
            <button type="button" class="btn btn-secondary btn-sm" data-cf-clear>Limpiar</button>
            <button type="button" class="btn btn-primary btn-sm" data-cf-ok>Aceptar</button>
          </div>`;
        document.body.appendChild(pop);
        const rect = btn.getBoundingClientRect();
        pop.style.top = Math.min(rect.bottom + 4, window.innerHeight - 320) + 'px';
        pop.style.left = Math.min(rect.left, window.innerWidth - 280) + 'px';
        icons();
        const list = pop.querySelector('#cfList');
        pop.querySelector('#cfSearch').addEventListener('input', (ev) => {
          const q = ev.target.value.trim().toLowerCase();
          list.querySelectorAll('.cf-item').forEach(lab => {
            lab.style.display = !q || lab.textContent.toLowerCase().includes(q) ? '' : 'none';
          });
        });
        pop.querySelector('[data-cf-all]').addEventListener('click', () => list.querySelectorAll('input[type=checkbox]').forEach(c => { if (c.closest('.cf-item').style.display !== 'none') c.checked = true; }));
        pop.querySelector('[data-cf-none]').addEventListener('click', () => list.querySelectorAll('input[type=checkbox]').forEach(c => { if (c.closest('.cf-item').style.display !== 'none') c.checked = false; }));
        pop.querySelector('[data-cf-clear]').addEventListener('click', () => {
          delete ui.matrixColFilters[col];
          pop.remove();
          applyColFilters();
          btn.classList.remove('active');
        });
        pop.querySelector('[data-cf-ok]').addEventListener('click', () => {
          const set = new Set();
          list.querySelectorAll('input[type=checkbox]:checked').forEach(c => set.add(c.value));
          if (set.size === sorted.length) delete ui.matrixColFilters[col];
          else ui.matrixColFilters[col] = set;
          btn.classList.toggle('active', !!ui.matrixColFilters[col]);
          pop.remove();
          applyColFilters();
        });
        const close = (ev) => {
          if (!pop.contains(ev.target) && ev.target !== btn) { pop.remove(); document.removeEventListener('mousedown', close); }
        };
        setTimeout(() => document.addEventListener('mousedown', close), 0);
      });
      if (ui.matrixColFilters[btn.dataset.colFilter]) btn.classList.add('active');
    });
    applyColFilters();
    bindMatrixActs();
  }
  function bindMatrixActs() {
    // data-act handlers are bound globally in bindView; ensure clicks on matrix rows still work after re-render
    $$('#matrixBody [data-act], #view [data-act]').forEach(el => {
      // no-op: bindView uses delegation on #app typically
    });

  function exportMatrixXlsx() {
    const docs = S.docs.filter(d => areaAccess(d.areaId).level);
    const headers = ['Unidad de negocio','Nomenclatura','Nombre','Macroproceso','Área','Departamento','Tipo de Documento','Categoría','Clasificación','Versión','Fecha de emisión','Fecha de última actualización','Fecha de autorización','Fecha de difusión','URL','Documento Rector','Estado'];
    const rows = docs.map(d => {
      const a = areaById(d.areaId), f = folderById(d.folderId), u = unitById(a?.unitId);
      const rector = d.rectorId ? (docById(d.rectorId)?.nomenclatura || '') : '';
      return [u?.name||'', d.nomenclatura, d.nombre, d.macroproceso||'', a?.name||'', f?.name||'', d.tipo||'', d.categoria||'', d.clasificacion||'', d.version, fmtDate(d.fechaEmision), fmtDate(d.fechaActualizacion), fmtDate(d.fechaAutorizacion), fmtDate(d.fechaDifusion), d.url||localDocUrl(d.id), rector, estadoLabel(computeEstado(d))];
    });
    // CSV con BOM para Excel
    const escC = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const csv = '\ufeff' + [headers, ...rows].map(r => r.map(escC).join(',')).join('\n');
    saveBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), `matriz-documental-${new Date().toISOString().slice(0,10)}.csv`);
    toast('Matriz exportada');
  }

  function enableResizableColumns(sel) {
    const table = $(sel);
    if (!table) return;
    const key = table.id || sel;
    const wrap = table.closest('.table-wrap') || table.parentElement;
    if (wrap) { wrap.style.overflowX = 'auto'; wrap.style.overflowY = 'auto'; }
    table.style.width = 'max-content';
    table.style.minWidth = '100%';
    const ths = $$('thead th', table);
    const saved = (ui.colWidths && ui.colWidths[key]) || null;
    const applyCol = (idx, px) => {
      const w = Math.max(48, px) + 'px';
      const th = ths[idx];
      if (!th) return;
      th.style.width = w; th.style.minWidth = w; th.style.maxWidth = w;
      $$('tbody tr', table).forEach(tr => {
        const td = tr.children[idx];
        if (td) {
          td.style.width = w; td.style.minWidth = w; td.style.maxWidth = w;
          td.style.whiteSpace = 'nowrap'; td.style.overflow = 'hidden'; td.style.textOverflow = 'ellipsis';
        }
      });
    };
    // Anchos iniciales: restaurar los guardados o medir el layout actual
    ths.forEach((th, idx) => {
      th.style.position = 'relative';
      th.style.whiteSpace = 'nowrap';
      th.style.overflow = 'hidden';
      th.style.textOverflow = 'ellipsis';
      const px = (saved && saved[idx] != null) ? saved[idx] : Math.max(48, Math.round(th.getBoundingClientRect().width));
      applyCol(idx, px);
    });
    ths.forEach((th, idx) => {
      if (th.querySelector('.col-resizer')) return;
      const grip = document.createElement('span');
      grip.className = 'col-resizer';
      grip.style.cssText = 'position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize;user-select:none;z-index:2;';
      th.appendChild(grip);
      let startX, startW;
      const onMove = (e) => {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const dx = clientX - startX;
        applyCol(idx, startW + dx);
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onUp);
        // Persistir anchos para que no se reviertan al re-render
        ui.colWidths = ui.colWidths || {};
        ui.colWidths[key] = ths.map(th => parseInt(th.style.width, 10) || th.offsetWidth);
      };
      const onDown = (e) => {
        e.preventDefault(); e.stopPropagation();
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startW = th.offsetWidth;
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onUp);
      };
      grip.addEventListener('mousedown', onDown);
      grip.addEventListener('touchstart', onDown, { passive: false });
    });
  }

  /* ---------------- Carpeta ---------------- */
  function folderView() {
    const f = folderById(route.folderId); const a = f && areaById(f.areaId);
    if (!f || !a) { route.view = 'home'; return homeView(); }
    const acc = areaAccess(a.id);
    if (!acc.level) { route.areaId = a.id; return areaView(); }
    let docs = S.docs.filter(d => d.folderId === f.id);
    if (ui.filter) { const q = ui.filter.toLowerCase(); docs = docs.filter(d => (d.nomenclatura + ' ' + d.nombre + ' ' + d.fileName + ' ' + d.tipo + ' ' + d.clasificacion).toLowerCase().includes(q)); }
    const sorters = { recent: (x, y) => y.updatedAt - x.updatedAt, code: (x, y) => x.nomenclatura.localeCompare(y.nomenclatura, 'es', { numeric: true }), name: (x, y) => x.nombre.localeCompare(y.nombre, 'es') };
    docs.sort(sorters[ui.sort]);
    docs.sort((a, b) => (computeEstado(a) === 'eliminado' ? 1 : 0) - (computeEstado(b) === 'eliminado' ? 1 : 0));
    if (ui.folderColSort && ui.folderColSort.col != null) docs = sortDocsByCol(docs, 'folder');
    const up = canUploadIn(a.id);
    const u = unitById(a.unitId);
    return `${crumbs([...(u ? [{ label: u.name, act: 'openUnit', id: u.id }] : []), { label: a.name, act: 'openArea', id: a.id }, { label: f.name }])}
      <div class="page-title" style="${cssVars(a.color)}">
        <div class="folder-icon" style="${cssVars(f.color || a.color || 'blue')};width:64px;height:52px;margin:0"><div class="back"></div><div class="front" style="height:40px"></div>${f.icon ? `<span class="folder-glyph">${ic(f.icon)}</span>` : ''}</div>
        <div><h1>${esc(f.name)}</h1></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${accessChip(acc)}<span class="chip">${ic('hash')}${esc(f.code)}</span></div>
      <div class="toolbar-row">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <div class="seg" role="tablist"><button class="${ui.docView === 'list' ? 'on' : ''}" data-act="docView" data-v="list">${ic('list')}Lista</button><button class="${ui.docView === 'grid' ? 'on' : ''}" data-act="docView" data-v="grid">${ic('layout-grid')}Cuadrícula</button></div>
          <select class="select" id="sortSel" style="height:36px;width:auto;border-radius:980px;font-size:13px">
            <option value="recent" ${ui.sort === 'recent' ? 'selected' : ''}>Más recientes</option>
            <option value="code" ${ui.sort === 'code' ? 'selected' : ''}>Por nomenclatura</option>
            <option value="name" ${ui.sort === 'name' ? 'selected' : ''}>Por nombre</option></select>
          <button type="button" class="btn btn-secondary btn-sm" id="folderSelBtn">${(ui.folderSelected && ui.folderSelected.size) ? `${ic('download')}Descargar (${ui.folderSelected.size})` : (ui.folderSelectMode ? `${ic('x')}Cancelar selección` : `${ic('check-square')}Seleccionar`)}</button>
          ${ui.folderSelectMode ? `<button type="button" class="btn btn-secondary btn-sm" id="folderMoveBtn" ${!(ui.folderSelected && ui.folderSelected.size) ? 'disabled' : ''}>${ic('folder-input')}Mover o copiar${ui.folderSelected && ui.folderSelected.size ? ` (${ui.folderSelected.size})` : ''}</button>` : ''}
          ${ui.folderSelectMode && can('deleteDocs') ? `<button type="button" class="btn btn-danger btn-sm" id="folderDelBtn" ${!(ui.folderSelected && ui.folderSelected.size) ? 'disabled' : ''}>${ic('trash-2')}Eliminar${ui.folderSelected && ui.folderSelected.size ? ` (${ui.folderSelected.size})` : ''}</button>` : ''}
          
          <button type="button" class="btn btn-ghost btn-sm" id="folderClearFilters">${ic('rotate-ccw')}Limpiar</button>
          <label class="search" style="width:220px">${ic('filter')}<input id="docFilter" placeholder="Filtrar en carpeta" value="${esc(ui.filter)}" /></label>
        </div>
        ${up ? `<button class="btn btn-primary" data-act="pick">${ic('upload')}Subir documentos</button>` : ''}
      </div>
      ${up ? `<div class="dropzone" id="dz"><div class="dz-icon">${ic('cloud-upload')}</div><strong>Arrastra uno o varios archivos aquí</strong>
        <span>o <button class="btn-ghost" style="font-weight:500" data-act="pick">selecciónalos de tu equipo</button> · máx. ${S.settings.maxMB} MB por archivo</span>
        <input type="file" id="fileInput" multiple hidden accept="${S.settings.allowedExt.split(',').map(e => '.' + e.trim()).join(',')}" /></div>` : ''}
      ${docs.length ? (ui.docView === 'list'
        ? docTable(treeOrder(docs, { refs: false }))
        : `<div class="doc-grid">${treeOrder(docs, { refs: false }).map((it, i) => docTile(it, i)).join('')}</div>`)
        : emptyState('file-text', ui.filter ? 'Sin resultados' : 'Carpeta vacía', ui.filter ? 'Ningún documento coincide con el filtro.' : up ? 'Sube el primer documento de este departamento.' : 'Aún no hay documentos en esta carpeta.')}`;
  }

  const badge = (ext) => `<div class="file-badge" style="background:${EXT_COLOR[ext] || '#8e8e93'}">${esc((ext || 'doc').toUpperCase().slice(0, 4))}</div>`;
  const fmtDocDate = (d) => d && d.fechaActualizacion ? fmtDate(d.fechaActualizacion) : '—';
  const FOLDER_COL_LABELS = ['', 'Documento', 'Nomenclatura', 'Nombre', 'Macroproceso', 'Área', 'Departamento', 'Tipo de Documento', 'Categoría', 'Clasificación', 'Versión', 'Fecha de emisión', 'Fecha de última actualización', 'Fecha de autorización', 'Fecha de difusión', 'Estado', 'URL', ''];
  const folderColTh = (lab, i, filterable = true) => {
    if (!(filterable && lab)) return `<th${lab ? '' : ' style="width:44px"'}>${lab || ''}</th>`;
    const fs = ui.folderColSort || { col: null, dir: 'asc' };
    const on = ui.colSortMark === 'folder' && fs.col === i;
    const arrow = on ? (fs.dir === 'asc' ? ' ↑' : ' ↓') : '';
    const tip = (fs.col === i) ? (fs.dir === 'asc' ? 'Orden ascendente (clic para invertir)' : 'Orden descendente (clic para invertir)') : 'Ordenar columna';
    return `<th data-col="${i}" class="${on ? 'col-sorted col-sorted-' + fs.dir : ''}"><span class="th-label th-sort" data-folder-sort-col="${i}" title="${tip}" role="button" tabindex="0">${lab}${arrow}</span><button type="button" class="col-filter-btn" data-folder-col-filter="${i}" title="Filtrar columna" aria-label="Filtrar ${lab}">${ic('chevrons-up-down')}</button></th>`;
  };
  const docHeader = () => {
    const selMode = !!ui.folderSelectMode;
    return `<thead><tr>
      ${selMode ? `<th class="matrix-sel-td" title="Seleccionar" style="width:44px;min-width:44px;max-width:44px;text-align:center">${ic('check-square')}</th>` : ''}
      ${folderColTh('', 0, false)}
      ${folderColTh('Documento', 1)}
      ${folderColTh('Nomenclatura', 2)}
      ${folderColTh('Nombre', 3)}
      ${folderColTh('Macroproceso', 4)}
      ${folderColTh('Área', 5)}
      ${folderColTh('Departamento', 6)}
      ${folderColTh('Tipo de Documento', 7)}
      ${folderColTh('Categoría', 8)}
      ${folderColTh('Clasificación', 9)}
      ${folderColTh('Versión', 10)}
      ${folderColTh('Fecha de emisión', 11)}
      ${folderColTh('Fecha de última actualización', 12)}
      ${folderColTh('Fecha de autorización', 13)}
      ${folderColTh('Fecha de difusión', 14)}
      ${folderColTh('Estado', 15)}
      ${folderColTh('URL', 16)}
      ${folderColTh('', 17, false)}
    </tr></thead>`;
  };
  // rows: documentos o elementos de árbol {d, depth, ref, hit}
  const levelLegend = () => `<div class="lvl-legend">${CATEGORIAS.map(c => `<span class="lg lvl-${LEVEL[c]}"><i></i>${CAT_LEVEL[c]} · ${c}</span>`).join('')}</div>`;
  const docTable = (rows, info = false) => `${info ? '' : levelLegend()}<div class="doc-list ${info ? 'info' : ''}"><div class="doc-scroll table-wrap"><table class="tbl doc-tbl" id="${info ? 'infoDocTbl' : 'folderDocTbl'}">${docHeader()}<tbody>${rows.map(r => r.d ? docRow(r.d, info, r) : docRow(r, info)).join('')}</tbody></table></div></div>`;

  /* Ordena la lista por jerarquía: primero 1er nivel, debajo sus documentos de 2º nivel y, debajo de cada uno,
     los de 3er nivel. Los documentos sin rector van después, en orden de nivel. Si el rector está fuera de la lista
     (otra carpeta o filtrado), se inserta como fila de referencia. Dentro de cada nivel se respeta el orden elegido. */
  function treeOrder(list, { refs = true, hits = null } = {}) {
    const ids = new Set(list.map(d => d.id));
    const pos = new Map(list.map((d, i) => [d.id, i]));
    const byLvl = (a, b) => lvlOf(a) - lvlOf(b) || pos.get(a.id) - pos.get(b.id);
    const out = [], used = new Set();
    const mark = (d) => hits ? hits.has(d.id) : false;
    const emit = (d, depth, extra = {}) => {
      if (used.has(d.id)) return; used.add(d.id);
      out.push({ d, depth, hit: mark(d), ...extra });
      list.filter(k => k.rectorId === d.id).sort(byLvl).forEach(k => emit(k, depth + 1));
    };
    const roots = list.filter(d => !(d.rectorId && ids.has(d.rectorId)));
    // Raíces con rector en otra carpeta: se agrupan bajo una fila de referencia del rector
    const ext = new Map();
    const own = [];
    roots.forEach(d => {
      const r = d.rectorId && docById(d.rectorId);
      if (r && refs && areaAccess(r.areaId).level) { if (!ext.has(r.id)) ext.set(r.id, []); ext.get(r.id).push(d); }
      else own.push({ d, orphan: !!r });
    });
    for (const L of [1, 2, 3, 4]) {
      own.filter(o => lvlOf(o.d) === L).sort((a, b) => byLvl(a.d, b.d)).forEach(o => emit(o.d, 0, o.orphan ? { orphan: true } : {}));
      [...ext].filter(([rid]) => lvlOf(docById(rid)) === L).forEach(([rid, kids]) => {
        out.push({ d: docById(rid), depth: 0, ref: true });
        kids.sort(byLvl).forEach(k => emit(k, 1));
      });
    }
    return out;
  }
  const docById = (id) => S.docs.find(d => d.id === id);

  function docRow(d, info = false, t = {}) {
    const f = folderById(d.folderId), a = areaById(d.areaId);
    const r = d.rectorId ? docById(d.rectorId) : null;
    const nk = childrenOf(d.id).length;
    const st = computeEstado(d);
    const copySrc = d.copiedFrom ? docById(d.copiedFrom) : null;
    const sub = info ? `${esc(a?.name || '')} / ${esc(f?.name || '')}`
      : t.ref ? `Documento rector · ${esc(a?.name || '')} / ${esc(f?.name || '')}`
      : copySrc ? `Copia de ${esc(copySrc.nomenclatura)}${copySrc.folderId !== d.folderId ? ` · ${esc(folderById(copySrc.folderId)?.name || '')}` : ''}`
      : (t.orphan || (t.depth && r && r.folderId !== d.folderId)) && r ? `Rector: ${esc(r.nomenclatura)}${r.folderId !== d.folderId ? ` · ${esc(folderById(r.folderId)?.name || '')}` : ''}`
      : (!t.depth && nk && !info) ? `${nk} ${nk === 1 ? 'documento asociado' : 'documentos asociados'}`
      : (() => {
          // No mostrar el nombre de archivo original debajo: suele conservar la nomenclatura antigua
          // y confunde tras renombrar. Solo se muestra si es claramente distinto de nomenclatura/nombre.
          const fn = (d.fileName || '').trim();
          if (!fn) return '';
          const base = fn.replace(/\.[a-zA-Z0-9]+$/, '').trim();
          const nom = (d.nomenclatura || '').trim();
          const nombre = (d.nombre || '').trim();
          const b = base.toLowerCase();
          if (nom && b.includes(nom.toLowerCase())) return '';
          if (nombre && (b === nombre.toLowerCase() || b.includes(nombre.toLowerCase()))) return '';
          if (nom && nombre && b === `${nom} ${nombre}`.toLowerCase()) return '';
          return esc(fn);
        })();
    const depth = t.depth || 0;
    const del = st === 'eliminado';
    const url = d.url || localDocUrl(d.id);
    const pad = depth ? `padding-left:${12 + depth * 16}px` : '';
    const rowStyle = del ? 'background:var(--danger-soft)' : '';
    const styles = [];
    if (!info && !t.ref) styles.push('cursor:pointer');
    if (del) styles.push('background:var(--danger-soft)');
    const styleAttr = styles.length ? ` style="${styles.join(';')}"` : '';
    const folderSel = !info && !!ui.folderSelectMode;
    if (!ui.folderSelected) ui.folderSelected = new Set();
    const isSel = folderSel && ui.folderSelected.has(d.id);
    const act = (info || t.ref || folderSel) ? '' : ` data-act="openDoc" data-id="${d.id}"`;
    const menu = info
      ? `<span class="tiny" title="Solo informativo">${ic('eye-off')}</span>`
      : t.ref
        ? `<span class="tiny" title="Documento rector en otra carpeta">${ic('link')}</span>`
        : `<button class="icon-btn" data-act="docMenu" data-id="${d.id}" aria-label="Opciones">${ic('ellipsis')}</button>`;
    const cells = [
      (d.ext || 'doc').toUpperCase(),
      `${d.nomenclatura} ${d.nombre}`,
      d.nomenclatura || '',
      d.nombre || '',
      d.macroproceso || '—',
      a?.name || '—',
      f?.name || '—',
      d.tipo || '—',
      d.categoria || '—',
      d.clasificacion || '—',
      String(d.version ?? ''),
      fmtDate(d.fechaEmision),
      fmtDocDate(d),
      fmtDate(d.fechaAutorizacion),
      fmtDate(d.fechaDifusion),
      estadoLabel(st),
      url || '',
      ''
    ];
    return `<tr class="doc-tr lvl-${lvlOf(d)} ${t.ref ? 'ref' : ''} ${t.hit ? 'hit' : ''} ${isSel ? 'row-selected' : ''}"${act}${styleAttr} data-cells="${encodeURIComponent(JSON.stringify(cells))}" data-id="${d.id}">
      ${folderSel ? `<td class="matrix-sel-td" onclick="event.stopPropagation()"><input type="checkbox" class="matrix-sel folder-sel" data-id="${d.id}" ${isSel ? 'checked' : ''} aria-label="Seleccionar"/></td>` : ''}
      <td>${badge(d.ext)}</td>
      <td class="doc-name" style="${pad}"><div>${depth ? `<i class="tree-mark">${ic('corner-down-right')}</i>` : ''}<div><strong>${esc(d.nomenclatura)} ${esc(d.nombre)}</strong><span>${sub}</span></div></div></td>
      <td class="mono">${esc(d.nomenclatura)}</td>
      <td title="${esc(d.nombre)}">${esc(d.nombre)}</td>
      <td>${esc(d.macroproceso || '—')}</td>
      <td>${esc(a?.name || '—')}</td>
      <td>${esc(f?.name || '—')}</td>
      <td>${d.tipo ? `<span class="chip">${esc(d.tipo)}</span>` : '—'}</td>
      <td>${catChip(d.categoria)}</td>
      <td>${d.clasificacion ? `<span class="chip ${clasifClass(d.clasificacion)}">${esc(d.clasificacion)}</span>` : '—'}</td>
      <td><span class="chip ver">${esc(d.version)}</span></td>
      <td>${fmtDate(d.fechaEmision)}</td>
      <td>${fmtDocDate(d)}</td>
      <td>${fmtDate(d.fechaAutorizacion)}</td>
      <td>${fmtDate(d.fechaDifusion)}</td>
      <td>${estadoChip(d)}</td>
      <td>${/^https?:\/\//i.test(url)
        ? `<a class="url-ver" href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="${esc(url)}" onclick="event.stopPropagation()">Ver</a>`
        : `<button type="button" class="url-ver" data-act="openDoc" data-id="${d.id}" title="${esc(url)}">Ver</button>`}</td>
      <td>${menu}</td>
    </tr>`;
  }
  const clasifClass = (c) => /confiden|restring|secret|reserv/i.test(c) ? 'danger' : /p[uú]blic/i.test(c) ? 'ok' : 'accent';
  function docTile(it, i) {
    const d = it.d || it, r = d.rectorId ? docById(d.rectorId) : null;
    return `<div class="doc-tile lvl-${lvlOf(d)} ${it.depth ? 'child' : ''} ${it.ref ? 'ref' : ''}" data-act="openDoc" data-id="${d.id}" style="animation-delay:${i * 40}ms" tabindex="0" role="button">
      ${badge(d.ext)}<span class="mono tiny">${esc(d.nomenclatura)}</span><strong>${esc(d.nombre)}</strong>
      <span class="tiny">${d.tipo ? esc(d.tipo) + ' · ' : ''}Versión ${esc(d.version)} · ${fmtDocDate(d)}</span>
      ${it.ref ? '<span class="tiny tile-rel">Documento rector · otra carpeta</span>' : r ? `<span class="tiny tile-rel">${ic('corner-down-right')}Rector: ${esc(r.nomenclatura)}</span>` : ''}</div>`;
  }

  /* ---------------- Dashboard ---------------- */
  ui.dash = { area: '', year: '', cat: '', tipo: '' };
  const charts = [];
  const PALETTE = ['#0a84ff', '#30d158', '#ff9f0a', '#bf5af2', '#ff375f', '#64d2ff', '#ffd60a', '#5e5ce6', '#ac8e68', '#00c7be', '#8e8e93'];
  const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  const yearOf = (d) => String(d.fechaActualizacion || '').slice(0, 4);
  const countBy = (arr, fn) => { const m = new Map(); arr.forEach(x => { const k = fn(x); m.set(k, (m.get(k) || 0) + 1); }); return [...m.entries()].sort((a, b) => b[1] - a[1]); };

  function dashboardShell() {
    return `<section id="dash" class="dash">
      <div class="section-head"><div><h2>Panel de información</h2><p class="tiny" style="margin-top:4px">Calculado sobre las áreas a las que tienes acceso. Filtros en cascada: Unidad → Área → Año → Categoría → Tipo.</p></div>
        <div class="dash-filters">
          <label class="dsel"><span>Unidad de negocio</span><select class="select" id="dfUnit"></select></label>
          <label class="dsel"><span>Área</span><select class="select" id="dfArea"></select></label>
          <label class="dsel"><span>Año</span><select class="select" id="dfYear"></select></label>
          <label class="dsel"><span>Categoría</span><select class="select" id="dfCat"></select></label>
          <label class="dsel"><span>Tipo de documento</span><select class="select" id="dfTipo"></select></label>
          <button class="btn btn-ghost btn-sm" id="dfClear">${ic('rotate-ccw')}Limpiar</button>
        </div></div>
      <div class="kpis" id="dKpis"></div>
      <div class="charts charts-3">
        <div class="chart-card"><div class="ch-head"><h4>Por Estado</h4></div><div class="ch-box"><canvas id="cEst"></canvas></div></div>
        <div class="chart-card"><div class="ch-head"><h4>Por Categoría</h4></div><div class="ch-box"><canvas id="cCat"></canvas></div></div>
        <div class="chart-card"><div class="ch-head"><h4>Por Clasificación</h4></div><div class="ch-box"><canvas id="cClas"></canvas></div></div>
      </div>
      <div class="charts" style="margin-top:16px">
        <div class="chart-card"><div class="ch-head"><h4 id="tMes">Documentos por Año</h4><span class="rk-total" id="rkYearTotal"></span></div><div class="ch-box" id="rkYear" style="height:auto;min-height:200px;padding:8px 12px 12px"></div></div>
        <div class="chart-card"><div class="ch-head"><h4 id="tTipo">Documentos por Tipo</h4><span class="rk-total" id="rkTipoTotal"></span></div><div class="ch-box" id="rkTipo" style="height:auto;min-height:200px;padding:8px 12px 12px"></div></div>
        <div class="chart-card span2"><div class="ch-head"><h4 id="tArea">Documentos por área</h4></div><div class="ch-box"><canvas id="cArea"></canvas></div></div>
      </div>
      <div class="charts" style="margin-top:16px">
        <div class="chart-card"><div class="ch-head"><h4 id="tMesBar">Por Año (Actualización)</h4></div><div class="ch-box"><canvas id="cMesBar"></canvas></div></div>
        <div class="chart-card"><div class="ch-head"><h4 id="tTipoBar">Por Tipo de Documento</h4></div><div class="ch-box"><canvas id="cTipoBar"></canvas></div></div>
      </div>
    </section>`;
  }

  function bindDashboard() {
    const order = ['unit', 'area', 'year', 'cat', 'tipo'];
    ['dfUnit', 'dfArea', 'dfYear', 'dfCat', 'dfTipo'].forEach((id, i) => $('#' + id).addEventListener('change', (e) => {
      ui.dash[order[i]] = e.target.value;
      order.slice(i + 1).forEach(k => ui.dash[k] = '');
      updateDashboard();
    }));
    $('#dfClear').addEventListener('click', () => { ui.dash = { unit: '', area: '', year: '', cat: '', tipo: '' }; updateDashboard(); });
    updateDashboard();
  }

  function updateDashboard() {
    if (!window.Chart || !$('#dash')) return;
    const accIds = new Set(S.areas.filter(a => areaAccess(a.id).level).map(a => a.id));
    const all = S.docs.filter(d => accIds.has(d.areaId));
    const f = ui.dash = Object.assign({ unit: '', area: '', year: '', cat: '', tipo: '' }, ui.dash || {});
    // Nivel 0: unidad de negocio
    const unitOf = (d) => areaById(d.areaId)?.unitId || '';
    const unitOpts = (S.units || []).filter(u => all.some(d => unitOf(d) === u.id));
    if (f.unit && !unitOpts.some(u => u.id === f.unit)) f.unit = '';
    const lvl0 = all.filter(d => !f.unit || unitOf(d) === f.unit);
    // Nivel 1: área
    const areaOpts = S.areas.filter(a => accIds.has(a.id) && lvl0.some(d => d.areaId === a.id) && (!f.unit || a.unitId === f.unit));
    if (f.area && !areaOpts.some(a => a.id === f.area)) f.area = '';
    const lvl1 = lvl0.filter(d => !f.area || d.areaId === f.area);
    // Nivel 2: año
    const years = [...new Set(lvl1.map(yearOf).filter(Boolean))].sort((a, b) => b - a);
    if (f.year && !years.includes(f.year)) f.year = '';
    const lvl2 = lvl1.filter(d => !f.year || yearOf(d) === f.year);
    // Nivel 3: categoría
    const catOf = (d) => d.categoria || 'Sin categoría';
    const cats = [...CATEGORIAS, 'Sin categoría'].filter(c => lvl2.some(d => catOf(d) === c));
    if (f.cat && !cats.includes(f.cat)) f.cat = '';
    const lvl3 = lvl2.filter(d => !f.cat || catOf(d) === f.cat);
    // Nivel 4: tipo
    const tipos = [...new Set(lvl3.map(d => d.tipo || 'Sin tipo'))].sort((a, b) => a.localeCompare(b, 'es'));
    if (f.tipo && !tipos.includes(f.tipo)) f.tipo = '';
    const data = lvl3.filter(d => !f.tipo || (d.tipo || 'Sin tipo') === f.tipo);

    const opt = (v, l, sel) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(l)}</option>`;
    if ($('#dfUnit')) $('#dfUnit').innerHTML = opt('', 'Todas las unidades', f.unit) + unitOpts.map(u => opt(u.id, `${u.code} · ${u.name} (${all.filter(d => unitOf(d) === u.id).length})`, f.unit)).join('');
    $('#dfArea').innerHTML = opt('', 'Todas las áreas', f.area) + areaOpts.map(a => opt(a.id, `${a.name} (${lvl0.filter(d => d.areaId === a.id).length})`, f.area)).join('');
    $('#dfYear').innerHTML = opt('', 'Todos los años', f.year) + years.map(y => opt(y, `${y} (${lvl1.filter(d => yearOf(d) === y).length})`, f.year)).join('');
    $('#dfCat').innerHTML = opt('', 'Todas las categorías', f.cat) + cats.map(c => opt(c, `${c} (${lvl2.filter(d => catOf(d) === c).length})`, f.cat)).join('');
    $('#dfTipo').innerHTML = opt('', 'Todos los tipos', f.tipo) + tipos.map(t => opt(t, `${t} (${lvl3.filter(d => (d.tipo || 'Sin tipo') === t).length})`, f.tipo)).join('');
    $('#dfClear').classList.toggle('hidden', !f.unit && !f.area && !f.year && !f.cat && !f.tipo);

    // KPIs estilo imagen: Total / Nuevo / Actualizado / Pendiente
    const estCount = (id) => data.filter(d => computeEstado(d) === id).length;
    const nNuevo = estCount('nuevo'), nAct = estCount('actualizado'), nPend = estCount('pendiente'), nRat = estCount('ratificado'), nEli = estCount('eliminado');
    const kpi = (val, label, color = '') => `<div class="kpi"${color ? ` style="--kpi:${color}"` : ''}><strong>${val}</strong><span>${label}</span></div>`;
    $('#dKpis').innerHTML = [
      kpi(data.length, 'Total'),
      kpi(nNuevo, 'Nuevo', 'var(--ok)'),
      kpi(nAct, 'Actualizado', 'var(--accent)'),
      kpi(nPend, 'Pendiente', 'var(--warn)'),
    ].join('');

    // Gráficos
    charts.splice(0).forEach(c => c.destroy());
    const cs = getComputedStyle(document.documentElement);
    const txt = cs.getPropertyValue('--text-2').trim(), grid = cs.getPropertyValue('--line').trim(), bg = cs.getPropertyValue('--bg-elev').trim();
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.color = txt;
    const base = { responsive: true, maintainAspectRatio: false, animation: { duration: 700, easing: 'easeOutQuart' }, plugins: { legend: { display: false }, tooltip: { padding: 10, cornerRadius: 10 } } };
    const axes = (horizontal = false) => ({
      x: { grid: { display: horizontal, color: grid }, border: { display: false }, ticks: horizontal ? { precision: 0 } : {} },
      y: { grid: { display: !horizontal, color: grid }, border: { display: false }, beginAtZero: true, ticks: horizontal ? {} : { precision: 0 } },
    });
    const empty = (id) => { const c = $('#' + id); const box = c.parentElement; box.querySelector('.ch-empty')?.remove(); if (!data.length) box.insertAdjacentHTML('beforeend', '<div class="ch-empty">Sin datos para los filtros elegidos</div>'); return !data.length; };
    const mk = (id, cfg) => { if (empty(id)) return; charts.push(new Chart($('#' + id), cfg)); };

    // Ranking helper: lista horizontal con barra y % (Documentos por Año / por Tipo)
    const renderRank = (boxId, totalId, titleId, title, rows) => {
      const box = $('#' + boxId); const totEl = $('#' + totalId); const tEl = $('#' + titleId);
      if (tEl) tEl.textContent = title;
      const total = rows.reduce((s, r) => s + r[1], 0);
      if (totEl) totEl.textContent = total ? String(total) : '';
      if (!box) return;
      box.querySelector('.ch-empty')?.remove();
      if (!data.length || !rows.length) {
        box.innerHTML = '<div class="ch-empty">Sin datos para los filtros elegidos</div>';
        return;
      }
      const max = Math.max(...rows.map(r => r[1]), 1);
      box.innerHTML = `<ul class="rank-list">${rows.map((r, i) => {
        const pct = total ? ((r[1] / total) * 100) : 0;
        const barPct = (r[1] / max) * 100;
        const color = PALETTE[i % PALETTE.length];
        return `<li>
          <div class="rk-left">
            <span class="rk-label" title="${esc(r[0])}">${esc(r[0])}<span class="rk-count">${r[1]}</span></span>
            <div class="rk-bar-wrap"><div class="rk-bar" style="width:${barPct.toFixed(1)}%;background:${color}"></div></div>
          </div>
          <span class="rk-pct">${pct.toFixed(1)}%</span>
        </li>`;
      }).join('')}</ul>`;
    };

    // 1. Documentos por Año (fecha de última actualización)
    let yearRows;
    if (f.year) {
      yearRows = MESES.map((m, i) => [m, data.filter(d => d.fechaActualizacion && +d.fechaActualizacion.slice(5, 7) === i + 1).length]).filter(r => r[1]);
      renderRank('rkYear', 'rkYearTotal', 'tMes', `Documentos por mes · ${f.year}`, yearRows);
    } else {
      const ys = [...new Set(data.map(yearOf).filter(Boolean))].sort();
      yearRows = ys.map(y => [y, data.filter(d => yearOf(d) === y).length]);
      renderRank('rkYear', 'rkYearTotal', 'tMes', 'Documentos por Año', yearRows);
    }

    // 2. Por área o por departamento
    let rowsA;
    if (f.area) { $('#tArea').textContent = `Documentos por departamento · ${areaById(f.area).name}`; rowsA = countBy(data, d => folderById(d.folderId)?.name || '—'); }
    else { $('#tArea').textContent = 'Documentos por área'; rowsA = countBy(data, d => areaById(d.areaId)?.name || '—'); }
    const aColor = (name) => { const a = S.areas.find(x => x.name === name); return a ? (COLORS[a.color] || COLORS.blue)[0] : (COLORS[areaById(f.area)?.color] || COLORS.blue)[0]; };
    mk('cArea', { type: 'bar', data: { labels: rowsA.map(r => r[0]), datasets: [{ data: rowsA.map(r => r[1]), backgroundColor: rowsA.map(r => aColor(r[0])), borderRadius: 8, maxBarThickness: 28 }] }, options: { ...base, indexAxis: 'y', scales: axes(true) } });

    // Donas: Estado, Categoría, Clasificación + Tipo (barras)
    const donut = (id, rows, colors) => mk(id, { type: 'doughnut', data: { labels: rows.map(r => r[0]), datasets: [{ data: rows.map(r => r[1]), backgroundColor: colors || rows.map((_, i) => PALETTE[i % PALETTE.length]), borderColor: bg, borderWidth: 3, hoverOffset: 8 }] },
      options: { ...base, cutout: '64%', plugins: { ...base.plugins, legend: { display: true, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, usePointStyle: true, padding: 12 } } } } });

    // Estado según computeEstado (mismas reglas que el resto de la app)
    const estIdOrder = ['nuevo', 'actualizado', 'pendiente', 'ratificado', 'eliminado'];
    const estColorMap = { nuevo: '#0a84ff', actualizado: '#30d158', pendiente: '#ff9f0a', ratificado: '#5e5ce6', eliminado: '#ff453a' };
    const estCounts = {};
    data.forEach(d => { const id = computeEstado(d); estCounts[id] = (estCounts[id] || 0) + 1; });
    const estRows = estIdOrder.filter(id => estCounts[id]).map(id => [estadoLabel(id), estCounts[id]]);
    Object.keys(estCounts).forEach(id => {
      if (!estIdOrder.includes(id) && estCounts[id]) estRows.push([estadoLabel(id), estCounts[id]]);
    });
    const estColorsArr = estRows.map(([lab]) => {
      const rule = (S.settings.estadoRules || []).find(r => r.name === lab || r.id === lab);
      const id = rule?.id || String(lab).toLowerCase();
      if (estColorMap[id]) return estColorMap[id];
      if (rule?.color === 'ok') return '#30d158';
      if (rule?.color === 'warn') return '#ff9f0a';
      if (rule?.color === 'danger') return '#ff453a';
      if (rule?.color === 'accent') return '#0a84ff';
      return '#8e8e93';
    });
    donut('cEst', estRows.length ? estRows : [['Sin datos', 0]], estColorsArr);

    const cr = [...CATEGORIAS, 'Sin categoría'].map(c => [c, data.filter(d => catOf(d) === c).length]).filter(r => r[1]);
    const catColors = cr.map(r => CAT_COLOR[r[0]] || '#8e8e93');
    donut('cCat', cr, catColors);

    donut('cClas', countBy(data, d => d.clasificacion || 'Sin clasificación'));

    // Documentos por Tipo (ranking)
    const tr = countBy(data, d => d.tipo || 'Sin tipo');
    renderRank('rkTipo', 'rkTipoTotal', 'tTipo', 'Documentos por Tipo', tr);

    // Gráficos de barras verticales (como la imagen de referencia)
    const coloredBar = (canvasId, labels, values, titleEl, title) => {
      if (titleEl) titleEl.textContent = title;
      const colors = labels.map((_, i) => PALETTE[i % PALETTE.length]);
      mk(canvasId, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: colors,
            borderRadius: 6,
            maxBarThickness: 52,
          }],
        },
        options: {
          ...base,
          scales: axes(),
          plugins: {
            ...base.plugins,
            legend: {
              display: true,
              position: 'bottom',
              labels: {
                boxWidth: 10, boxHeight: 10, usePointStyle: true, padding: 12, font: { size: 11 },
                generateLabels: (chart) => labels.map((lab, i) => ({
                  text: `${lab}: ${values[i]}`,
                  fillStyle: colors[i],
                  strokeStyle: colors[i],
                  hidden: false,
                  index: i,
                  pointStyle: 'circle',
                })),
              },
            },
            tooltip: {
              ...base.plugins.tooltip,
              callbacks: {
                title: (items) => items[0]?.label || '',
                label: (ctx) => `Documentos: ${ctx.raw ?? 0}`,
              },
            },
          },
        },
      });
    };

    let barLabels, barValues;
    if (f.year) {
      barLabels = MESES;
      barValues = MESES.map((_, i) => data.filter(d => d.fechaActualizacion && +d.fechaActualizacion.slice(5, 7) === i + 1).length);
      coloredBar('cMesBar', barLabels, barValues, $('#tMesBar'), `Por mes · ${f.year}`);
    } else {
      const ys = [...new Set(data.map(yearOf).filter(Boolean))].sort();
      barLabels = ys;
      barValues = ys.map(y => data.filter(d => yearOf(d) === y).length);
      coloredBar('cMesBar', barLabels, barValues, $('#tMesBar'), 'Por Año (Actualización)');
    }
    coloredBar('cTipoBar', tr.map(r => r[0]), tr.map(r => r[1]), $('#tTipoBar'), 'Por Tipo de Documento');

    icons();
  }

  /* ---------------- Búsqueda ---------------- */
  function searchView() {
    const q = route.q.trim().toLowerCase();
    const ok = (d) => d && areaAccess(d.areaId).level;
    const res = S.docs.filter(d => ok(d) && (d.nomenclatura + ' ' + d.nombre + ' ' + d.fileName + ' ' + d.tipo + ' ' + (d.categoria || '') + ' ' + d.clasificacion).toLowerCase().includes(q));
    // Relacionados por rector/asociados/copias aunque estén en otras carpetas o áreas
    const hits = new Set(res.map(d => d.id));
    const list = collectRelatedDocs(res, ok).sort((x, y) => x.nomenclatura.localeCompare(y.nomenclatura, 'es', { numeric: true }));
    ui.lastSearchDocs = list;
    const rel = list.length - res.length;
    return `${crumbs([{ label: 'Búsqueda' }])}
      <div class="page-title"><h1>“${esc(route.q)}”</h1></div>
      <p class="page-sub">${res.length} ${res.length === 1 ? 'resultado' : 'resultados'}${rel ? ` + ${rel} ${rel === 1 ? 'documento relacionado' : 'documentos relacionados'} (rector, asociados o copias; cualquier carpeta)` : ''} en las áreas a las que tienes acceso</p>
      ${list.length ? `<div style="margin:12px 0"><button type="button" class="btn btn-secondary btn-sm" id="searchDlAll">${ic('download')}Descargar resultados (${list.length})</button></div>` : ''}
      <div style="margin-top:24px">${res.length ? docTable(treeOrder(list, { refs: false, hits })) : emptyState('search-x', 'Sin coincidencias', 'Prueba con otra nomenclatura o nombre.')}</div>`;
  }

  /* ---------------- Eventos de vistas ---------------- */

  function bindFolderColFilters(tableSel = '#folderDocTbl') {
    const tbl = $(tableSel);
    if (!tbl) return;
    const key = tableSel === '#infoDocTbl' ? 'searchColFilters' : 'folderColFilters';
    if (!ui[key]) ui[key] = {};
    const tbody = tbl.querySelector('tbody');
    if (!tbody) return;
    const applyColFilters = () => {
      const filters = ui[key] || {};
      tbody.querySelectorAll('tr').forEach(tr => {
        let cells;
        try { cells = JSON.parse(decodeURIComponent(tr.getAttribute('data-cells') || '%5B%5D')); } catch { cells = []; }
        let ok = true;
        Object.keys(filters).forEach(ci => {
          const set = filters[ci];
          if (!set || !set.size) return;
          const val = String(cells[+ci] ?? '');
          if (!set.has(val)) ok = false;
        });
        tr.style.display = ok ? '' : 'none';
      });
    };
    tbl.querySelectorAll('[data-folder-sort-col]').forEach(el => {
      if (el.dataset.sortBound) return;
      el.dataset.sortBound = '1';
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        toggleTableColSort('folder', +el.dataset.folderSortCol);
        render();
      });
    });
    tbl.querySelectorAll('[data-folder-col-filter]').forEach(btn => {
      if (btn.dataset.boundColFilter) return;
      btn.dataset.boundColFilter = '1';
      if (ui[key][btn.dataset.folderColFilter]) btn.classList.add('active');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const col = +btn.dataset.folderColFilter;
        $$('.col-filter-pop').forEach(p => p.remove());
        const values = new Set();
        tbody.querySelectorAll('tr').forEach(tr => {
          try {
            const cells = JSON.parse(decodeURIComponent(tr.getAttribute('data-cells') || '%5B%5D'));
            values.add(String(cells[col] ?? ''));
          } catch {}
        });
        const sorted = [...values].sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));
        const selected = ui[key][col] || new Set(sorted);
        const pop = document.createElement('div');
        pop.className = 'col-filter-pop';
        pop.innerHTML = `
          <div class="cf-search"><input class="input" type="search" placeholder="Buscar…" id="cfSearch"/></div>
          <div class="cf-actions">
            <button type="button" class="btn-ghost btn btn-sm" data-cf-all>Seleccionar todo</button>
            <button type="button" class="btn-ghost btn btn-sm" data-cf-none>Deseleccionar todo</button>
          </div>
          <div class="cf-list" id="cfList">${sorted.map(v => {
            const checked = selected.has(v) ? 'checked' : '';
            return `<label class="cf-item"><input type="checkbox" value="${esc(v)}" ${checked}/><span title="${esc(v)}">${esc(v || '(vacío)')}</span></label>`;
          }).join('')}</div>
          <div class="cf-foot">
            <button type="button" class="btn btn-secondary btn-sm" data-cf-clear>Limpiar</button>
            <button type="button" class="btn btn-primary btn-sm" data-cf-ok>Aceptar</button>
          </div>`;
        document.body.appendChild(pop);
        const rect = btn.getBoundingClientRect();
        pop.style.top = Math.min(rect.bottom + 4, window.innerHeight - 320) + 'px';
        pop.style.left = Math.min(rect.left, window.innerWidth - 280) + 'px';
        icons();
        const list = pop.querySelector('#cfList');
        pop.querySelector('#cfSearch').addEventListener('input', (ev) => {
          const q = ev.target.value.trim().toLowerCase();
          list.querySelectorAll('.cf-item').forEach(lab => {
            lab.style.display = !q || lab.textContent.toLowerCase().includes(q) ? '' : 'none';
          });
        });
        pop.querySelector('[data-cf-all]').addEventListener('click', () => list.querySelectorAll('input[type=checkbox]').forEach(c => { if (c.closest('.cf-item').style.display !== 'none') c.checked = true; }));
        pop.querySelector('[data-cf-none]').addEventListener('click', () => list.querySelectorAll('input[type=checkbox]').forEach(c => { if (c.closest('.cf-item').style.display !== 'none') c.checked = false; }));
        pop.querySelector('[data-cf-clear]').addEventListener('click', () => {
          delete ui[key][col];
          pop.remove();
          applyColFilters();
          btn.classList.remove('active');
        });
        pop.querySelector('[data-cf-ok]').addEventListener('click', () => {
          const set = new Set();
          list.querySelectorAll('input[type=checkbox]:checked').forEach(c => set.add(c.value));
          if (set.size === sorted.length) delete ui[key][col];
          else ui[key][col] = set;
          btn.classList.toggle('active', !!ui[key][col]);
          pop.remove();
          applyColFilters();
        });
        const close = (ev) => {
          if (!pop.contains(ev.target) && ev.target !== btn) { pop.remove(); document.removeEventListener('mousedown', close); }
        };
        setTimeout(() => document.addEventListener('mousedown', close), 0);
      });
    });
    applyColFilters();
  }

  function bindView() {
    const q = $('#q');
    if (q) {
      let t; q.addEventListener('input', () => {
        clearTimeout(t); t = setTimeout(() => {
          const v = q.value.trim();
          if (v.length >= 2) {
            route.q = v; route.view = 'search';
            $('#view').innerHTML = searchView(); icons();
            $('#searchDlAll')?.addEventListener('click', () => {
              downloadDocsBulk(ui.lastSearchDocs || [], 'busqueda-' + (route.q || 'docs').toString().slice(0, 40));
            });
          }
          else if (!v && route.view === 'search') go('home');
        }, 220);
      });
      if (route.view === 'search') { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    }
    $('#searchDlAll')?.addEventListener('click', () => {
      downloadDocsBulk(ui.lastSearchDocs || [], 'busqueda-' + (route.q || 'docs').toString().slice(0, 40));
    });
    if (ui.docView === 'list') { enableResizableColumns('#folderDocTbl'); bindFolderColFilters(); }
    enableResizableColumns('#infoDocTbl');
    if ($('#infoDocTbl')) bindFolderColFilters('#infoDocTbl');
    // Selección masiva en matriz de carpeta
    $('#folderSelBtn')?.addEventListener('click', async () => {
      if (!ui.folderSelected) ui.folderSelected = new Set();
      if (!ui.folderSelectMode) {
        ui.folderSelectMode = true;
        render();
        return;
      }
      if (!ui.folderSelected.size) {
        ui.folderSelectMode = false;
        render();
        return;
      }
      const docs = [...ui.folderSelected].map(id => docById(id)).filter(Boolean);
      await downloadDocsBulk(docs, 'carpeta-seleccion');
    });
    $('#folderMoveBtn')?.addEventListener('click', () => {
      if (!ui.folderSelected || !ui.folderSelected.size) return;
      const docs = [...ui.folderSelected].map(id => docById(id)).filter(Boolean);
      moveDocsModal(docs);
    });
    $('#folderDelBtn')?.addEventListener('click', async () => {
      if (!ui.folderSelected || !ui.folderSelected.size) return;
      const docs = [...ui.folderSelected].map(id => docById(id)).filter(Boolean);
      await deleteDocsBulk(docs);
    });
    $('#folderClearFilters')?.addEventListener('click', () => {
      ui.folderColFilters = {};
      ui.filter = '';
      render();
      toast('Filtros limpiados');
    });
    $('#folderDocTbl')?.addEventListener('change', (e) => {
      const cb = e.target.closest('.folder-sel');
      if (!cb) return;
      if (!ui.folderSelected) ui.folderSelected = new Set();
      if (cb.checked) ui.folderSelected.add(cb.dataset.id);
      else ui.folderSelected.delete(cb.dataset.id);
      const tr = cb.closest('tr');
      if (tr) tr.classList.toggle('row-selected', cb.checked);
      const n = ui.folderSelected.size;
      const btn = $('#folderSelBtn');
      if (btn) {
        btn.innerHTML = n
          ? `${ic('download')}Descargar (${n})`
          : (ui.folderSelectMode ? `${ic('x')}Cancelar selección` : `${ic('check-square')}Seleccionar`);
      }
      const mv = $('#folderMoveBtn');
      if (mv) {
        mv.disabled = !n;
        mv.innerHTML = `${ic('folder-input')}Mover o copiar${n ? ` (${n})` : ''}`;
      }
      const del = $('#folderDelBtn');
      if (del) {
        del.disabled = !n;
        del.innerHTML = `${ic('trash-2')}Eliminar${n ? ` (${n})` : ''}`;
      }
      icons();
    });
    const sort = $('#sortSel'); sort && sort.addEventListener('change', () => { ui.sort = sort.value; render(); });
    const filt = $('#docFilter');
    if (filt) {
      let t; filt.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { ui.filter = filt.value; render(); const n = $('#docFilter'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); });
    }
    const dz = $('#dz');
    if (dz) {
      const fi = $('#fileInput');
      fi.addEventListener('change', () => { startUpload(Array.from(fi.files), folderById(route.folderId)); fi.value = ''; });
      ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('drag'); }));
      ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('drag'); }));
      dz.addEventListener('drop', (e) => startUpload(Array.from(e.dataTransfer.files), folderById(route.folderId)));
    }
    if (route.view === 'settings') bindSettings();
    if (route.view === 'dashboard' && $('#dash')) bindDashboard();
    if (route.view === 'matrix') bindMatrix();
    if (window.CyperAI) CyperAI.syncFab();
  }

  const ACT = {
    home: () => { ui.filter = ''; go('home'); },
    matrix: () => go('matrix'),
    dashboard: () => go('dashboard'),
    settings: () => go('settings', { tab: can('settings') ? (route.tab || 'general') : 'users' }),
    theme: () => {
      const cur = document.documentElement.dataset.theme;
      S.settings.theme = cur === 'dark' ? 'light' : 'dark'; save(); applyTheme(); render();
    },
    usermenu: (el) => {
      const m = document.createElement('div');
      m.className = 'dropdown';
      m.innerHTML = `<div class="dropdown-head"><strong>${esc(me.name)}</strong><span class="tiny">${esc(me.email)}</span><div style="margin-top:8px"><span class="chip accent">${esc(roleOf().name)}</span></div></div>
        <button class="dropdown-item" data-m="access">${ic('key-round')}Mis accesos</button>
        <button class="dropdown-item" data-m="pass">${ic('lock-keyhole')}Cambiar contraseña</button>
        ${can('settings') || can('managePerms') ? `<button class="dropdown-item" data-m="settings">${ic('settings')}Configuración</button>` : ''}
        <div style="height:1px;background:var(--line);margin:6px 4px"></div>
        <button class="dropdown-item danger" data-m="logout">${ic('log-out')}Cerrar sesión</button>`;
      const wrap = el.parentElement; $$('.dropdown', wrap).forEach(x => x.remove()); wrap.appendChild(m); icons();
      m.addEventListener('click', (e) => {
        const b = e.target.closest('[data-m]'); if (!b) return; m.remove();
        if (b.dataset.m === 'logout') { log('acceso', 'Cierre de sesión'); save(); me = null; SessionStore.removeItem(SESSION); render(); }
        if (b.dataset.m === 'settings') ACT.settings();
        if (b.dataset.m === 'access') myAccessModal();
        if (b.dataset.m === 'pass') changePassModal();
      });
      setTimeout(() => document.addEventListener('click', (e) => { if (!m.contains(e.target)) m.remove(); }, { once: true }), 0);
    },
    grant: (el) => grantModal(null, el.dataset.area ? [el.dataset.area] : []),

              toast('Valor actualizado');

              toast('Valor eliminado');

        });
      };
      sel.addEventListener('dblclick', tryEdit);

  const rectorHint = (cat) => cat === 'Operativo' ? 'Puede asociarse a un documento de 1er nivel (Estratégico). Si lo eliges, aparecerá debajo de él en la lista.'

  function rectorOptions(rectorId, selfId, folder, cat) {
    const allowed = RECTOR_CATS[cat] || [];
    const cand = S.docs.filter(d => d.id !== selfId && allowed.includes(d.categoria) && areaAccess(d.areaId).level);
    if (!cand.length) return `<option value="">Sin documento rector (no hay documentos de ${cat === 'Operativo' ? '1er nivel' : '1er o 2º nivel'} disponibles)</option>`;

    cand.sort((a, b) => key(a).localeCompare(key(b), 'es') || a.nomenclatura.localeCompare(b.nomenclatura, 'es', { numeric: true }))

    return '<option value="">Sin documento rector</option>' + [...groups].map(([k, ds]) => `<optgroup label="${esc(k.slice(2))}">${ds.map(d => `<option value="${d.id}" ${d.id === rectorId ? 'selected' : ''}>${esc(d.nomenclatura)} · ${esc(d.nombre)} (${esc(d.tipo)} · ${CAT_LEVEL[d.categoria]})</option>`).join('')}</optgroup>`).join('');

  function rectorCandidates(selfId, folder, cat) {

            backgroundColor: dark ? '#1c1c1e' : '#ffffff',

  function bindTipoBlock(root) {
    const b = root.querySelector('.tipo-block'); if (!b) return;

    const rs = b.querySelector('[name=rector]');
    let lastCat = catOfTipo(sel.value);
    const sync = () => {
      const c = catOfTipo(sel.value);
      catI.value = c; hint.textContent = c ? CAT_LEVEL[c] : 'Automática';
      catI.className = 'input ' + (CAT_CLASS[c] || '');
      rf.className = 'field rector-field ' + (RECTOR_CATS[c] ? 'lvl-' + LEVEL[c] : 'hidden');
      if (c !== lastCat) {
        // Al cambiar de nivel se limpia el rector si ya no aplica
        const keep = rs ? rs.value : '';
        const still = keep && rectorCandidates(b.dataset.self || null, folderById(b.dataset.folder), c).some(d => d.id === keep);
        if (!still) {
          if (rs) rs.value = '';
          const s = b.querySelector('[data-rector-search]');
          if (s) s.value = '';
        }
        lastCat = c;
      }
      b.querySelector('[data-rector-hint]').textContent = rectorHint(c);
      sel.classList.remove('invalid');

      if (RECTOR_CATS[c] && b._refreshRector) b._refreshRector();

    sel.addEventListener('change', () => {

        const folder = folderById(b.dataset.folder);
        if (folder) {
          const cur = (nom.value || '').trim();
          let s = '';
          if (cur) {
            // Respetar lo escrito: solo cambia el código de tipo (ANE, FOR, COM…)
            s = swapTipoInNomenclatura(cur, sel.value) || suggestNomenclatura(folder, sel.value);
          } else {
            s = suggestNomenclatura(folder, sel.value);
          }
          nom.dataset.autoUpdating = '1';
          nom.value = s || '';
          nom.dataset.suggested = cur ? (nom.dataset.suggested || '0') : '1';
          nom.dispatchEvent(new Event('input', { bubbles: true }));
