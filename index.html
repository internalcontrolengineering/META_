  /* ---------------- Carga de documentos ---------------- */
  function parseFileName(fileName, folder) {
    const base = fileName.replace(/\.[^.]+$/, '').trim();
    let rest = base, version = '', nomen = '';
    const vm = rest.match(/[\s_\-.(]+v(?:er(?:si[oó]n)?)?[\s.]?(\d+(?:\.\d+)*)\)?\s*$/i) || rest.match(/[\s_\-(]+v(\d+(?:\.\d+)*)\)?(?=[\s_\-]|$)/i);
    if (vm) { version = intVersion(vm[1]); rest = rest.replace(vm[0], ' '); }
    try {
      const m = rest.match(new RegExp(S.settings.nomenRegex));
      if (m) { nomen = (m[1] || m[0]); rest = rest.slice(rest.indexOf(m[0]) + m[0].length); }
    } catch (e) { /* regex inválida en config */ }
    let nombre = rest.replace(/[_]+/g, ' ').replace(/^[\s\-–—_.:]+|[\s\-–—_.:]+$/g, '').replace(/\s{2,}/g, ' ');
    if (!nombre) nombre = base.replace(/[_]+/g, ' ');
    nombre = nombre.charAt(0).toUpperCase() + nombre.slice(1);
    nomen = nomen.toUpperCase().replace(/_/g, '-');
    let suggested = false;
    if (!nomen && folder) {
      // Sin nomenclatura en el archivo: se generará al elegir el tipo de documento
      nomen = '';
      suggested = true;
    }
    return { nomenclatura: nomen, nombre, version, suggested };
  }

  function startUpload(files, folder, replaceDoc = null) {
    if (!files.length || !folder) return;
    if (!canUploadIn(folder.areaId)) return toast('No tienes permiso para subir en esta área', 'err');
    const allowed = S.settings.allowedExt.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
    const max = S.settings.maxMB * 1048576;
    const ok = [], bad = [];
    for (const f of files) {
      const e = extOf(f.name);
      if (!allowed.includes(e)) bad.push(`${f.name}: formato .${e} no permitido`);
      else if (f.size > max) bad.push(`${f.name}: supera ${S.settings.maxMB} MB`);
      else ok.push(f);
    }
    if (bad.length) toast(bad.length === 1 ? bad[0] : `${bad.length} archivos rechazados por formato o tamaño`, 'err');
    if (!ok.length) return;
    const queue = { files: ok, i: 0, shared: null, done: 0, folder, replaceDoc };
    uploadStep(queue);
  }

  function uploadStep(Q) {
    if (!Q.drafts) Q.drafts = [];
    if (!Q.doneFiles) Q.doneFiles = {};
    if (!Q.skipped) Q.skipped = {};
    // Pendiente = ni publicado ni descartado (se puede publicar en cualquier orden)
    const isPending = (k) => !Q.doneFiles[k] && !Q.skipped[k];
    const nextPending = (from) => {
      for (let k = from; k < Q.files.length; k++) if (isPending(k)) return k;
      return -1;
    };
    const prevPending = (from) => {
      for (let k = from; k >= 0; k--) if (isPending(k)) return k;
      return -1;
    };
    // Cualquier pendiente, empezando después de `after` y dando la vuelta (no fuerza orden de subida)
    const anyPendingAfter = (after) => {
      for (let k = after + 1; k < Q.files.length; k++) if (isPending(k)) return k;
      for (let k = 0; k <= after; k++) if (isPending(k)) return k;
      return -1;
    };
    const finishQueue = () => {
      const pub = Q.done || 0;
      const sk = Object.keys(Q.skipped).filter(k => Q.skipped[k]).length;
      if (pub && sk) toast(`${pub} publicado${pub === 1 ? '' : 's'}, ${sk} omitido${sk === 1 ? '' : 's'}`);
      else if (pub) toast(pub === 1 ? 'Documento publicado' : `${pub} documentos publicados`);
      else if (sk) toast(sk === 1 ? 'Documento omitido' : `${sk} documentos omitidos`, 'info');
      render();
    };
    if (!isPending(Q.i)) {
      const n = anyPendingAfter(Q.i);
      if (n < 0) { finishQueue(); return; }
      Q.i = n;
    }
    if (Q.i >= Q.files.length) { finishQueue(); return; }
    const file = Q.files[Q.i];
    const total = Q.files.length;
    const pendingLeft = Q.files.reduce((n, _, k) => n + (isPending(k) ? 1 : 0), 0);
    const a = areaById(Q.folder.areaId);
    const draft = Q.drafts[Q.i] || null;
    const p = Q.replaceDoc ? { nomenclatura: Q.replaceDoc.nomenclatura, nombre: Q.replaceDoc.nombre, version: nextVersion(Q.replaceDoc.version), tipo: Q.replaceDoc.tipo, clasificacion: Q.replaceDoc.clasificacion, rectorId: Q.replaceDoc.rectorId } : parseFileName(file.name, Q.folder);
    const tipo = draft?.tipo ?? Q.shared?.tipo ?? p.tipo ?? '', clasificacion = draft?.clasificacion ?? Q.shared?.clasificacion ?? p.clasificacion ?? '', rectorId = draft?.rectorId ?? Q.shared?.rectorId ?? p.rectorId ?? null;
    const fileDate = new Date(file.lastModified || now());
    const version = intVersion(draft?.version || Q.shared?.version || p.version || S.settings.versionInicial);
    const fecha = draft?.fecha || Q.shared?.fecha || toLocalInput(fileDate).slice(0, 10);
    // Nomenclatura: si el archivo trae una válida se respeta; si no, se propone para CADA archivo (individual o cola)
    const fromFile = !!(p.nomenclatura && !p.suggested);
    let nomenclatura = '';
    if (Q.replaceDoc) {
      nomenclatura = p.nomenclatura || '';
    } else if (draft && draft.autoNomen === false && String(draft.nomenclatura || '').trim()) {
      nomenclatura = draft.nomenclatura;
    } else if (fromFile) {
      nomenclatura = p.nomenclatura;
    } else {
      nomenclatura = tipo ? (suggestNomenclatura(Q.folder, tipo) || '') : (p.nomenclatura || '');
    }
    const nombreDoc = draft?.nombre ?? p.nombre;
    const ext = extOf(file.name);
    openModal({
      size: 'wide', dismissable: false,
      title: Q.replaceDoc ? 'Nueva versión del documento' : 'Datos del documento',
      sub: total > 1 ? `Archivo ${Q.i + 1} de ${total} · ${esc(a.name)} / ${esc(Q.folder.name)}` : `${esc(a.name)} / ${esc(Q.folder.name)}`,
      body: `${total > 1 ? `<div class="upload-nav">
          <button type="button" class="btn btn-ghost btn-sm" data-prev ${pendingLeft <= 1 ? 'disabled' : ''}>${ic('chevron-left')}Anterior</button>
          <div class="progress-steps" style="flex:1">${Q.files.map((_, k) => {
            const done = !!(Q.doneFiles && Q.doneFiles[k]);
            const sk = !!(Q.skipped && Q.skipped[k]);
            const cls = done ? 'done' : sk ? 'skip' : (k === Q.i ? 'now' : '');
            const tip = done ? (esc(Q.files[k].name) + ' · publicado') : sk ? (esc(Q.files[k].name) + ' · omitido') : esc(Q.files[k].name);
            return `<i class="${cls}" ${(!done && !sk) ? `data-goto="${k}" style="cursor:pointer"` : ''} title="${tip}"></i>`;
          }).join('')}</div>
          <button type="button" class="btn btn-ghost btn-sm" data-next ${pendingLeft <= 1 ? 'disabled' : ''}>Siguiente${ic('chevron-right')}</button>
        </div>
        <p class="tiny" style="text-align:center;margin:-4px 0 10px">${pendingLeft} pendiente${pendingLeft === 1 ? '' : 's'} de ${total} · puedes publicar en cualquier orden; el módulo se cierra al terminar o omitir todos</p>` : ''}
        <div class="file-preview-card">${badge(ext)}<div class="doc-name"><strong>${esc(file.name)}</strong><span>${fmtSize(file.size)} · modificado ${fmtDate(fileDate)}</span></div></div>
        <form id="uf" novalidate>
        <div class="row">
          <div class="field"><label for="uNom">Nomenclatura</label><input class="input mono" id="uNom" name="nomenclatura" value="${esc(nomenclatura)}" required ${Q.replaceDoc ? 'readonly' : ''} data-suggested="${Q.replaceDoc || fromFile ? '0' : '1'}"/>
            <div class="hint">${Q.replaceDoc ? 'Se conserva la nomenclatura del documento' : p.suggested && !draft ? 'Se generará al elegir el tipo de documento · editable' : 'Extraída del nombre del archivo · editable'}</div><div class="err hidden" id="dupWarn"></div></div>
          <div class="field"><label for="uNombre">Nombre del documento</label><input class="input" id="uNombre" name="nombre" value="${esc(nombreDoc)}" required/><div class="hint">Extraído del nombre del archivo · editable</div></div>

        <div class="row-3">
          <div class="field"><label for="uVer">Versión</label>${intInput(`id="uVer" name="version" value="${esc(version)}" required`)}<div class="hint">Número entero desde 1</div></div>
          <div class="field"><label for="uFecha">Fecha de última actualización</label><input class="input" id="uFecha" type="date" name="fecha" value="${fecha}" required/></div>

        ${tipoBlock({ tipo, rectorId, selfId: Q.replaceDoc?.id, folder: Q.folder, clasificacion })}
        <div class="row-3">
          ${catalogField('macroprocesos', 'macroproceso', Q.replaceDoc?.macroproceso || Q.shared?.macroproceso || '')}
          <div class="field"><label>Fecha de emisión</label><input class="input" type="date" name="fechaEmision" value="${esc(draft?.fechaEmision || Q.replaceDoc?.fechaEmision || fecha)}"/></div>

        ${total > 1 && pendingLeft > 1 ? `<label class="set-row" style="border:0;padding:4px 0;cursor:pointer"><span class="txt"><strong>Aplicar versión, fecha, tipo, rector y clasificación a los demás pendientes</strong><span>La nomenclatura y el nombre se siguen extrayendo de cada archivo</span></span><span class="switch"><input type="checkbox" name="applyAll" ${Q.shared ? 'checked' : ''}/><span></span></span></label>` : ''}

        <button class="btn btn-primary" data-ok>${ic('upload')}${pendingLeft > 1 ? 'Publicar y continuar' : 'Publicar'}</button>`,
      onMount: (c) => {
        const f = c.$('#uf');
        const checkDup = () => {
          const v = f.nomenclatura.value.trim().toUpperCase();
          if (!v) { c.$('#dupWarn')?.classList.add('hidden'); return; }
          const dup = !Q.replaceDoc && S.docs.find(d => d.areaId === Q.folder.areaId && d.nomenclatura === v);

          w.classList.toggle('hidden', !dup);
          if (dup) w.textContent = `Ya existe "${dup.nombre}" con esta nomenclatura en el área.`;
        };
        const syncEstadoUI = () => {
          const ver = intVersion(f.version?.value || '1');
          const fecha = f.fecha?.value || '';
          const forced = f.estado?.value;
          // Siempre respetar reglas: solo eliminado se conserva si el usuario lo eligió
          if (f.estado) {
            const resolved = resolveEstado(ver, fecha, forced === 'eliminado' ? 'eliminado' : (forced === 'ratificado' ? 'ratificado' : ''));
            if (forced === 'ratificado' && resolved.estado !== 'ratificado') {
              f.estado.value = resolved.estado;
            } else if (forced !== 'eliminado') {
              f.estado.value = resolved.estado;
            }
          }
          if (ver <= 1 && f.fechaEmision && !f.fechaEmision.dataset.touched) {
            f.fechaEmision.value = fecha;
          }
        };
        f.nomenclatura.addEventListener('input', () => {
          if (f.nomenclatura.dataset.autoUpdating === '1') { checkDup(); return; }
          f.nomenclatura.dataset.suggested = '0';
          f.nomenclatura.dataset.manual = f.nomenclatura.value.trim() ? '1' : '0';
          checkDup();
        });
        checkDup();
        f.version?.addEventListener('input', syncEstadoUI);
        f.version?.addEventListener('change', syncEstadoUI);
        f.fecha?.addEventListener('change', syncEstadoUI);
        f.fechaEmision?.addEventListener('change', () => { f.fechaEmision.dataset.touched = '1'; });
        f.estado?.addEventListener('change', () => {
          const v = f.estado.value;
          if (v === 'ratificado') {
            const calc = computeEstadoFrom(intVersion(f.version.value), f.fecha.value, 'ratificado', true);
            if (calc !== 'ratificado') {
              f.estado.value = calc;
              return toast('Ratificado solo cuando la antigüedad es mayor a 1 año y menor a 2', 'err');
            }
          }
        });
        bindCatalogFields(f); bindTipoBlock(f);
        syncEstadoUI();
        f.nomenclatura?.addEventListener('input', () => {
          if (f.nomenclatura.dataset && f.nomenclatura.dataset.autoUpdating !== '1') { f.nomenclatura.dataset.suggested = '0'; f.nomenclatura.dataset.manual = f.nomenclatura.value.trim() ? '1' : '0'; }
        });
        const saveDraft = () => {
          Q.drafts[Q.i] = {
            nomenclatura: f.nomenclatura?.value || '',
            autoNomen: f.nomenclatura?.dataset?.suggested === '1',
            nombre: f.nombre?.value || '',
            version: f.version?.value || '',
            fecha: f.fecha?.value || '',
            tipo: f.tipo?.value || '',
            rectorId: f.rector?.value || '',
            clasificacion: readCatalog(f, 'clasificacion') || '',
            macroproceso: readCatalog(f, 'macroproceso') || '',
            fechaEmision: f.fechaEmision?.value || '',
            fechaAutorizacion: f.fechaAutorizacion?.value || '',
            fechaDifusion: f.fechaDifusion?.value || '',
            estado: f.estado?.value || '',
          };
        };
        const goTo = (idx) => {
          if (idx < 0 || idx >= Q.files.length || idx === Q.i) return;
          if (Q.doneFiles[idx]) return toast('Ese documento ya fue publicado', 'info');
          if (Q.skipped[idx]) return toast('Ese documento fue omitido', 'info');
          saveDraft();
          c.close();
          Q.i = idx;
          setTimeout(() => uploadStep(Q), 200);
        };
        c.$('[data-prev]')?.addEventListener('click', () => {
          const p = prevPending(Q.i - 1);
          if (p >= 0) goTo(p);
          else {
            // dar la vuelta: último pendiente
            let last = -1;
            for (let k = Q.files.length - 1; k > Q.i; k--) if (isPending(k)) { last = k; break; }
            if (last >= 0) goTo(last);
          }
        });
        c.$('[data-next]')?.addEventListener('click', () => {
          const n = anyPendingAfter(Q.i);
          if (n >= 0 && n !== Q.i) goTo(n);
        });
        c.$$('[data-goto]')?.forEach(el => el.addEventListener('click', () => goTo(+el.dataset.goto)));
        c.$('[data-cancel]').addEventListener('click', () => { c.close(); if (Q.done) render(); });
        c.$('[data-skip]')?.addEventListener('click', () => {
          // Omitir = descartar este archivo; el módulo sigue si quedan pendientes
          Q.skipped[Q.i] = true;
          Q.drafts[Q.i] = null;
          c.close();
          const n = anyPendingAfter(Q.i);
          if (n < 0) { finishQueue(); return; }
          Q.i = n;
          setTimeout(() => uploadStep(Q), 260);
        });
        c.$('[data-ok]').addEventListener('click', async (ev) => {
          const req = ['nomenclatura', 'nombre', 'version', 'fecha'];
          let valid = true;
          req.forEach(k => { const el = f[k]; const bad = !el?.value?.trim(); if (el) el.classList.toggle('invalid', bad); if (bad) valid = false; });
          if (!valid) return toast('Nomenclatura, nombre, versión y fecha de última actualización son obligatorios', 'err');
          if (!validInt(f.version.value)) { f.version.classList.add('invalid'); return toast('La versión debe ser un número entero desde 1', 'err'); }
          const tb = readTipoBlock(f);
          if (tb.error) return toast(tb.error, 'err');
          if (Q.replaceDoc && tb.categoria && childConflict(Q.replaceDoc.id, tb.categoria)) return toast(childConflict(Q.replaceDoc.id, tb.categoria), 'err');
          const clasV = readCatalog(f, 'clasificacion'); // opcional
          const btn = ev.currentTarget; btn.disabled = true; btn.innerHTML = 'Procesando…';
          const macroV = readCatalog(f, 'macroproceso');
          const ver = intVersion(f.version.value);
          const fecha = f.fecha.value;
          const resolved = resolveEstado(ver, fecha, f.estado?.value);
          if (f.estado?.value === 'ratificado' && resolved.estado !== 'ratificado') {
            btn.disabled = false; btn.innerHTML = 'Publicar';
            return toast('Ratificado solo cuando la antigüedad es mayor a 1 año y menor a 2', 'err');
          }
          // Reflejar estado resuelto en el formulario (siempre respeta reglas)
          if (f.estado) f.estado.value = resolved.estado;
          const meta = {
            nomenclatura: f.nomenclatura.value.trim().toUpperCase(),
            nombre: f.nombre.value.trim(),
            version: ver,
            fecha,
            nota: f.nota.value.trim(),
            url: (f.url?.value || '').trim(),
            tipo: tb.tipo || '', categoria: tb.categoria || '', rectorId: tb.rectorId || null,
            clasificacion: clasV ? addToCatalog('clasificaciones', clasV) : '',
            macroproceso: macroV ? addToCatalog('macroprocesos', macroV) : '',
            fechaEmision: f.fechaEmision?.value || f.fecha.value,
            fechaAutorizacion: f.fechaAutorizacion?.value || '',
            fechaDifusion: f.fechaDifusion?.value || '',
            estado: resolved.estado,
            estadoManual: resolved.estadoManual,
          };
          // Duplicados globales de nomenclatura (misma nomenclatura + nombre = nueva versión)
          // IMPORTANTE: no mutar Q.replaceDoc (afectaría el resto de la cola multi-archivo)
          let replaceForThis = Q.replaceDoc || null;
          if (!replaceForThis) {
            const same = S.docs.find(d => d.nomenclatura.toUpperCase() === meta.nomenclatura && d.nombre.toLowerCase() === meta.nombre.toLowerCase());
            if (same) {
              replaceForThis = same;
              meta.version = intVersion(nextVersion(same.version));
            } else if (S.docs.find(d => d.nomenclatura.toUpperCase() === meta.nomenclatura)) {
              btn.disabled = false; btn.innerHTML = pendingLeft > 1 ? `${ic('upload')}Publicar y continuar` : `${ic('upload')}Publicar`;
              icons();
              return toast('Ya existe un documento con esa nomenclatura. Usa el mismo nombre para subir una nueva versión, o elige otra nomenclatura.', 'err');
            }
          }
          if (f.applyAll?.checked) Q.shared = { version: meta.version, fecha: meta.fecha, tipo: meta.tipo, rectorId: meta.rectorId, clasificacion: meta.clasificacion, macroproceso: meta.macroproceso }; else Q.shared = null;
          try {
            await storeUpload(file, meta, Q.folder, replaceForThis);
            Q.done++;
            Q.doneFiles[Q.i] = true;
            Q.drafts[Q.i] = null;
            toast(pendingLeft > 1 ? `Publicado · ${meta.nomenclatura} (disponible como rector)` : `Publicado · ${meta.nomenclatura}`, 'ok');
          } catch (e) {
            console.error(e);
            btn.disabled = false; btn.innerHTML = pendingLeft > 1 ? `${ic('upload')}Publicar y continuar` : `${ic('upload')}Publicar`;
            icons();
            return toast('No se pudo procesar ' + file.name, 'err');
          }
          c.close();
          // Pintar el documento en la lista de inmediato
          render();
          // Buscar cualquier pendiente restante (cualquier orden, no solo el siguiente en la cola)
          const n = anyPendingAfter(Q.i);
          if (n < 0) { finishQueue(); return; }
          Q.i = n;
          setTimeout(() => uploadStep(Q), 300);
        });
      },
    });
  }

  async function convertToHtml(file) {
    const ext = extOf(file.name);
    try {
      if (ext === 'docx' && window.mammoth) {
        const r = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() });
        return r.value || '<p></p>';
      }
      if (['xlsx', 'xls', 'csv'].includes(ext) && window.XLSX) {
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
        return wb.SheetNames.map(n => `<h2>${esc(n)}</h2>` + XLSX.utils.sheet_to_html(wb.Sheets[n], { header: '', footer: '' }).replace(/<\/?(html|head|body|meta)[^>]*>/gi, '').replace(/<title>.*?<\/title>/i, '')).join('');
      }
      if (['txt', 'md'].includes(ext)) {
        const t = await file.text();
        return t.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
      }
      if (ext === 'html') {
        const doc = new DOMParser().parseFromString(await file.text(), 'text/html');
        doc.querySelectorAll('script,style,iframe,object').forEach(n => n.remove());
        return doc.body.innerHTML;
      }
    } catch (e) { console.warn('Conversión fallida', e); }
    return null;
  }

  async function storeUpload(file, meta, folder, replaceDoc) {
    const ext = extOf(file.name);
    const html = await convertToHtml(file);
    if (replaceDoc) {
      const d = replaceDoc;
      // Respaldar versión previa
      const prevKey = `hist:${d.id}:${d.history.length}`;
      const prevHtml = await Files.get('html:' + d.id);
      const prevOrig = await Files.get('orig:' + d.id);
      await Files.put(prevKey, { html: prevHtml || null, orig: prevOrig || null, ext: d.ext, fileName: d.fileName });
      d.history[d.history.length - 1].key = prevKey;
      await Files.put('orig:' + d.id, file);
      if (html) await Files.put('html:' + d.id, html); else await Files.del('html:' + d.id);
      Object.assign(d, {
        version: meta.version, fechaActualizacion: meta.fecha, tipo: meta.tipo, categoria: meta.categoria, rectorId: meta.rectorId, clasificacion: meta.clasificacion,
        macroproceso: meta.macroproceso || d.macroproceso || '',
        fechaEmision: meta.fechaEmision || d.fechaEmision || '',
        fechaAutorizacion: meta.fechaAutorizacion || d.fechaAutorizacion || '',
        fechaDifusion: meta.fechaDifusion || d.fechaDifusion || '',
        estado: meta.estado || d.estado, estadoManual: !!meta.estadoManual,
        url: d.url || localDocUrl(d.id),
        fileName: file.name, ext, mime: file.type, size: file.size, editable: !!html, updatedAt: now(), updatedBy: me.id, subidoPor: me.id
      });
      d.history.push({ v: meta.version, at: now(), by: me.id, note: meta.nota || 'Nueva versión cargada', key: null });
      log('documento', `Subió la versión ${meta.version} de ${d.nomenclatura}`);
    } else {
      const id = Repo.uid('d_');
      await Files.put('orig:' + id, file);
      if (html) await Files.put('html:' + id, html);
      const url = localDocUrl(id);
      S.docs.push({
        id, areaId: folder.areaId, folderId: folder.id,
        nomenclatura: meta.nomenclatura, nombre: meta.nombre, version: meta.version, fechaActualizacion: meta.fecha,
        tipo: meta.tipo, categoria: meta.categoria, rectorId: meta.rectorId, clasificacion: meta.clasificacion,
        macroproceso: meta.macroproceso || '',
        fechaEmision: meta.fechaEmision || meta.fecha, fechaAutorizacion: meta.fechaAutorizacion || '', fechaDifusion: meta.fechaDifusion || '',
        estado: meta.estado || null, estadoManual: !!meta.estadoManual,
        url,
        subidoPor: me.id, fileName: file.name, ext, mime: file.type, size: file.size, editable: !!html,
        createdAt: now(), updatedAt: now(), updatedBy: me.id,
        history: [{ v: meta.version, at: now(), by: me.id, note: meta.nota || 'Publicación inicial', key: null }],
      });
      log('documento', `Publicó ${meta.nomenclatura} · ${meta.nombre} en ${folder.name}`);
    }
    save();
    try {
      const d = replaceDoc || S.docs.find(x => x.nomenclatura === meta.nomenclatura && x.folderId === folder.id);
      if (d && window.CyperAI) CyperAI.indexDoc(d, { html, file });
    } catch (e) { console.warn('AI index', e); }
  }

  async function purgeDocFiles(d) {
    await Files.del('orig:' + d.id); await Files.del('html:' + d.id);
    for (const h of d.history) if (h.key) await Files.del(h.key);

  async function deleteDoc(d) {
    const kids = childrenOf(d.id);
    if (!await confirmDestructive('¿Eliminar documento?', `${esc(d.nomenclatura)} · ${esc(d.nombre)} y todo su historial de versiones.${kids.length ? `<br/><br/>Es rector de ${kids.length} ${kids.length === 1 ? 'documento' : 'documentos'} (${kids.slice(0, 3).map(k => esc(k.nomenclatura)).join(', ')}${kids.length > 3 ? '…' : ''}), que quedarán sin documento rector.` : ''}`)) return;
    kids.forEach(k => k.rectorId = null);
    await purgeDocFiles(d);
    S.docs = S.docs.filter(x => x.id !== d.id);
    log('documento', `Eliminó ${d.nomenclatura} · ${d.nombre}`); save(); render(); toast('Documento eliminado');
  }

  async function deleteDocsBulk(docs) {
    const list = (docs || []).filter(Boolean);
    if (!list.length) return toast('No hay documentos seleccionados', 'err');
    if (!can('deleteDocs')) return toast('No tienes permiso para eliminar documentos', 'err');
    const deletable = list.filter(d => areaAccess(d.areaId).level === 'editar');
    if (!deletable.length) return toast('No tienes permiso de edición sobre los seleccionados', 'err');
    const skipped = list.length - deletable.length;
    const names = deletable.slice(0, 5).map(d => esc(d.nomenclatura)).join(', ');
    const more = deletable.length > 5 ? ` y ${deletable.length - 5} más` : '';
    let childNote = 0;
    deletable.forEach(d => { childNote += childrenOf(d.id).filter(k => !deletable.some(x => x.id === k.id)).length; });
    const text = `Se eliminarán <strong>${deletable.length}</strong> documento${deletable.length === 1 ? '' : 's'} (${names}${more}) y su historial.`
      + (childNote ? `<br/><br/>${childNote} asociado${childNote === 1 ? '' : 's'} quedarán sin documento rector.` : '')
      + (skipped ? `<br/><br/><span class="muted">${skipped} sin permiso se omitirán.</span>` : '');
    if (!await confirmDestructive('¿Eliminar documentos seleccionados?', text)) return;
    const ids = new Set(deletable.map(d => d.id));
    // Quitar vínculos de hijos que no se eliminan
    (S.docs || []).forEach(k => {
      if (k.rectorId && ids.has(k.rectorId) && !ids.has(k.id)) k.rectorId = null;
    });
    for (const d of deletable) {
      try { await purgeDocFiles(d); } catch (e) { console.warn(e); }
    }
    S.docs = (S.docs || []).filter(x => !ids.has(x.id));
    log('documento', `Eliminó ${deletable.length} documento(s) en lote`);
    if (ui.folderSelected) ui.folderSelected.clear();
    ui.folderSelectMode = false;
    if (ui.matrixSelected) ui.matrixSelected.clear();
    ui.matrixSelectMode = false;
    save();
    render();
    toast(`${deletable.length} documento${deletable.length === 1 ? '' : 's'} eliminado${deletable.length === 1 ? '' : 's'}`);
  }

  async function openViewer(d, historyEntry = null) {
    if (!d) return;
    const acc = areaAccess(d.areaId);
    if (!acc.level) return toast('Tu acceso a este documento no está vigente', 'err');
    const lvl = acc.level;
    const canEdit = lvl === 'editar' && d.editable && !historyEntry;
    const canDl = LV[lvl] >= 2;
    const a = areaById(d.areaId), f = folderById(d.folderId);
    const readonly = lvl === 'ver';
    log('consulta', `Abrió ${d.nomenclatura}${historyEntry ? ' (v' + historyEntry.v + ')' : ''}`); save();

    let objUrl = null, timer = null, editing = false, original = '';
    const ctx = openModal({
      size: 'full', title: '',
      body: '',
      onClose: () => { objUrl && URL.revokeObjectURL(objUrl); clearInterval(timer); document.body.classList.remove('no-print'); },
    });
    const m = ctx.el;
    m.querySelector('.modal-body').remove();
    const exp = acc.grant?.type === 'temporal' ? acc.grant.expiresAt : null;
    m.insertAdjacentHTML('beforeend', `
      <div class="viewer-head">
        ${badge(d.ext)}
        <div class="doc-name"><strong>${esc(d.nombre)}</strong><span class="mono">${esc(d.nomenclatura)} · Versión ${esc(historyEntry ? historyEntry.v : d.version)}${historyEntry ? ' (versión anterior)' : ''}</span></div>
        <div class="viewer-actions">
          ${accessChip(acc)}
          ${canEdit ? `<button class="btn btn-secondary" data-edit>${ic('pencil-line')}Editar</button>
            <button class="btn btn-secondary hidden" data-cancel-edit>Descartar</button>
            <button class="btn btn-primary hidden" data-save-edit>${ic('save')}Guardar cambios</button>` : ''}
          ${canDl ? `<button class="btn btn-secondary" data-dl>${ic('download')}Descargar</button>` : ''}
          <button class="icon-btn" data-x aria-label="Cerrar">${ic('x')}</button>
        </div>
      </div>
      <div class="viewer-body">
        <div class="viewer-stage ${readonly ? 'readonly' : ''}" id="stage"><div class="locked-state"><div class="tiny">Cargando documento…</div></div></div>
        <aside class="viewer-side">
          <h5>Detalles</h5>
          <dl class="kv">
            <dt>Nomenclatura</dt><dd class="mono">${esc(d.nomenclatura)}</dd>
            <dt>Nombre</dt><dd>${esc(d.nombre)}</dd>
            <dt>Versión</dt><dd>${esc(d.version)}</dd>
            <dt>Tipo de documento</dt><dd>${esc(d.tipo || '—')}</dd>
            <dt>Categoría</dt><dd>${d.categoria ? `${esc(d.categoria)} <span class="tiny">· ${CAT_LEVEL[d.categoria] || ''}</span>` : '—'}</dd>
            ${RECTOR_CATS[d.categoria] ? `<dt>Documento rector</dt><dd>${(() => { const r = docById(d.rectorId); return !r ? '<span class="tiny">Sin documento rector</span>' : areaAccess(r.areaId).level ? `<button class="rel-link" data-rel="${r.id}">${esc(r.nomenclatura)} · ${esc(r.nombre)}</button>` : `${esc(r.nomenclatura)} <span class="tiny">(sin acceso)</span>`; })()}</dd>` : ''}
            <dt>Clasificación</dt><dd>${esc(d.clasificacion || '—')}</dd>
            <dt>Fecha de última actualización</dt><dd>${fmtDocDate(d)}</dd>
            <dt>Subido por</dt><dd>${esc(userName(d.subidoPor))}</dd>
            <dt>Ubicación</dt><dd>${esc(a.name)} / ${esc(f?.name || '')}</dd>
            <dt>Archivo</dt><dd>${esc(d.fileName)}</dd>
            <dt>Tamaño</dt><dd>${fmtSize(d.size)}</dd>
          </dl>
          ${(() => { const ks = childrenOf(d.id); return ks.length ? `<h5>Documentos asociados (${ks.length})</h5><ul class="rel-list">${ks.map(k => `<li>${areaAccess(k.areaId).level ? `<button class="rel-link" data-rel="${k.id}">${esc(k.nomenclatura)} · ${esc(k.nombre)}</button>` : `${esc(k.nomenclatura)} <span class="tiny">(sin acceso)</span>`}<span class="tiny">${esc(k.tipo)}</span></li>`).join('')}</ul>` : ''; })()}
          <h5>Tu acceso</h5>
          <dl class="kv"><dt>Nivel</dt><dd>${LV_LABEL[lvl]}</dd><dt>Vigencia</dt><dd id="vig">${acc.full ? 'Permanente (perfil)' : exp ? `Hasta ${fmtDateTime(exp)}` : 'Permanente · revocable'}</dd></dl>
          <h5>Historial de versiones</h5>
          <ul class="history">${[...d.history].reverse().map((h, hi) => `<li><strong>Versión ${esc(h.v)}</strong> · ${fmtRel(h.at)}<br/><span class="tiny">${esc(userName(h.by))} — ${esc(h.note || '')}</span>
            ${h.key ? `<br/><button data-hist="${esc(h.key)}">Ver</button> <button data-hist-dl="${esc(h.key)}">Descargar</button> ${lvl === 'editar' ? `<button data-hist-restore="${esc(h.key)}" data-hv="${esc(h.v)}">Restaurar</button>` : ''}` : '<br/><span class="tiny">Versión actual</span>'}</li>`).join('')}</ul>
        </aside>
      </div>`);
    icons();
    m.querySelectorAll('[data-rel]').forEach(b => b.addEventListener('click', async () => {
      if (editing && !await confirmDialog({ title: '¿Descartar cambios?', text: 'Hay cambios sin guardar en el documento.', ok: 'Descartar', danger: true })) return;
      ctx.close(); setTimeout(() => openViewer(docById(b.dataset.rel)), 280);
    }));
    m.querySelector('[data-x]').addEventListener('click', async () => {
      if (editing && !await confirmDialog({ title: '¿Descartar cambios?', text: 'Hay cambios sin guardar en el documento.', ok: 'Descartar', danger: true })) return;
      ctx.close();
    });
    if (readonly) {
      if (S.settings.blockPrint) document.body.classList.add('no-print');
      m.addEventListener('contextmenu', e => e.preventDefault());
      m.addEventListener('copy', e => e.preventDefault());
    }
    // Vigilancia de expiración en vivo
    if (exp) timer = setInterval(() => {
      if (now() >= exp) {
        clearInterval(timer);
        if (S.settings.expiredBehavior !== 'ver') {
          ctx.close(); toast('Tu acceso temporal expiró. El documento se cerró.', 'err'); render();
        }
      }
    }, 5000);

    const stage = m.querySelector('#stage');
    const wm = S.settings.watermark && lvl !== 'editar' ? `<div class="watermark" style="--wm:${watermarkCss()}"></div>` : '';

    // Cargar contenido
    let html = null, blob = null, ext = d.ext;
    if (historyEntry) { const h = await Files.get(historyEntry.key); html = h?.html; blob = h?.orig; ext = h?.ext || ext; }
    else { html = d.editable ? await Files.get('html:' + d.id) : null; blob = await Files.get('orig:' + d.id); }

    const officeExt = ['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'csv'];
    const isOffice = officeExt.includes(ext);
    const externalUrl = (d.url || '').trim();
    const banner = (title, body) => `<div class="viewer-banner">${ic('info')}<div><strong>${title}</strong>${body}</div></div>`;

    // 1) PDF original
    if (blob && ext === 'pdf') {
      objUrl = URL.createObjectURL(blob);
      stage.innerHTML = `<div style="position:relative;height:100%">${wm}<iframe class="stage-frame" src="${objUrl}#toolbar=${readonly ? 0 : 1}" title="${esc(d.nombre)}"></iframe></div>`;
    }
    // 2) Imágenes
    else if (blob && ['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
      objUrl = URL.createObjectURL(blob);
      stage.innerHTML = `<div style="position:relative">${wm}<img class="stage-img" src="${objUrl}" alt="${esc(d.nombre)}" draggable="false"/></div>`;
    }
    // 3) URL externa pública → visor de Office Online (conserva formato Word/Excel/PPT)
    else if (externalUrl && isOffice && /^https?:\/\//i.test(externalUrl) && !historyEntry) {
      const embed = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(externalUrl);
      stage.innerHTML = `${banner('Vista con formato Office', 'Se muestra el archivo hospedado en la URL del documento mediante el visor de Microsoft. La edición en línea de esta app trabaja sobre una copia HTML aproximada; para cambios con formato completo edita el archivo original y súbelo como nueva versión.')}
        <iframe class="office-frame" src="${embed}" title="${esc(d.nombre)}"></iframe>
        ${html ? `<div style="margin-top:20px"><button class="btn btn-secondary btn-sm" id="showHtmlPrev">${ic('file-text')} Ver/editar copia HTML en la app</button></div><div id="htmlPrevBox" class="hidden" style="margin-top:12px"><div class="paper ${readonly ? 'readonly' : ''}" id="paper">${wm}${html}</div></div>` : ''}`;
      original = html || '';
      m.querySelector('#showHtmlPrev')?.addEventListener('click', () => {
        m.querySelector('#htmlPrevBox')?.classList.toggle('hidden');
      });
    }
    // 4) Vista HTML convertida (docx/xlsx/txt…) — edición en la app se guarda aquí
    else if (html) {
      const note = isOffice ? banner('Vista aproximada', `El archivo .${esc(ext)} se convirtió a HTML para previsualizar y editar en el navegador. <b>El formato no es idéntico al de Word/Excel/PowerPoint.</b> Los cambios que guardes aquí quedan en la aplicación (nueva versión). El archivo original se conserva al descargar “original”.${externalUrl ? ' Si el documento tiene URL pública, se puede ver con formato Office desde esa liga.' : ''}`) : '';
      stage.innerHTML = `${note}<div class="paper ${readonly ? 'readonly' : ''}" id="paper">${wm}${html}</div>`;
      original = html;
    }
    // 5) Solo binario Office sin HTML
    else if (blob && isOffice) {
      stage.innerHTML = emptyState('file-type', 'Vista previa limitada', `Los archivos .${esc(ext)} se almacenan en su formato original.${canDl ? ' Descárgalo para abrirlo en Word, Excel o PowerPoint.' : ''}${externalUrl ? ' También puedes usar la URL de hospedaje en la Matriz Documental.' : ' Al subir de nuevo un .docx/.xlsx se generará una vista HTML editable en la app.'}`);
    } else {
      stage.innerHTML = emptyState('file-question', 'Vista previa no disponible', `Los archivos .${esc(ext)} no se pueden previsualizar en el navegador.${canDl ? ' Puedes descargarlo para consultarlo.' : ''}`);
    }
    icons();

    m.querySelectorAll('[data-hist]').forEach(b => b.addEventListener('click', () => {
      const h = d.history.find(x => x.key === b.dataset.hist); openViewer(d, h);
    }));
    m.querySelectorAll('[data-hist-dl]').forEach(b => b.addEventListener('click', async () => {
      const h = d.history.find(x => x.key === b.dataset.histDl);
      if (!h) return;
      const pack = await Files.get(h.key);
      if (pack?.orig) saveBlob(pack.orig, `${d.nomenclatura}_v${h.v}.${pack.ext || d.ext}`);
      else if (pack?.html) saveBlob(new Blob([pack.html], { type: 'text/html' }), `${d.nomenclatura}_v${h.v}.html`);
      else toast('No hay archivo de esa versión', 'err');
    }));
    m.querySelectorAll('[data-hist-restore]').forEach(b => b.addEventListener('click', async () => {
      const h = d.history.find(x => x.key === b.dataset.histRestore);
      if (!h) return;
      if (!await confirmDialog({ title: '¿Restaurar esta versión?', text: `Se creará una nueva versión a partir de la v${h.v}. La versión actual se conservará en el historial.`, ok: 'Restaurar' })) return;
      const pack = await Files.get(h.key);
      if (!pack) return toast('No se encontró el contenido de esa versión', 'err');
      const prevKey = `hist:${d.id}:${d.history.length}`;
      const prevHtml = await Files.get('html:' + d.id);
      const prevOrig = await Files.get('orig:' + d.id);
      await Files.put(prevKey, { html: prevHtml || null, orig: prevOrig || null, ext: d.ext, fileName: d.fileName });
      d.history[d.history.length - 1].key = prevKey;
      if (pack.html) await Files.put('html:' + d.id, pack.html); else await Files.del('html:' + d.id);
      if (pack.orig) await Files.put('orig:' + d.id, pack.orig);
      const nv = intVersion(nextVersion(d.version));
      Object.assign(d, { version: nv, ext: pack.ext || d.ext, editable: !!pack.html, updatedAt: now(), updatedBy: me.id, fechaActualizacion: new Date().toISOString().slice(0, 10) });
      d.history.push({ v: nv, at: now(), by: me.id, note: `Restaurada desde v${h.v}`, key: null });
      log('documento', `Restauró ${d.nomenclatura} a partir de v${h.v} → v${nv}`);
      save(); toast(`Restaurada como versión ${nv}`);
      ctx.close(); setTimeout(() => openViewer(d), 280);
    }));
    m.querySelector('[data-dl]')?.addEventListener('click', (e) => downloadMenu(e.currentTarget, d, lvl, historyEntry));

    if (!canEdit) return;
    const bEdit = m.querySelector('[data-edit]'), bSave = m.querySelector('[data-save-edit]'), bCancel = m.querySelector('[data-cancel-edit]');
    const paper = () => m.querySelector('#paper');
    const toolbarHtml = `<div class="edit-toolbar" id="etb">
      <select data-block aria-label="Estilo de párrafo"><option value="p">Párrafo</option><option value="h1">Título 1</option><option value="h2">Título 2</option><option value="h3">Título 3</option></select>
      <span class="sep"></span>
      ${[['bold', 'bold', 'Negrita'], ['italic', 'italic', 'Cursiva'], ['underline', 'underline', 'Subrayado'], ['strikeThrough', 'strikethrough', 'Tachado']].map(([c, i, t]) => `<button class="icon-btn" data-cmd="${c}" title="${t}" aria-label="${t}">${ic(i)}</button>`).join('')}
      <span class="sep"></span>
      ${[['insertUnorderedList', 'list', 'Viñetas'], ['insertOrderedList', 'list-ordered', 'Numeración'], ['justifyLeft', 'align-left', 'Izquierda'], ['justifyCenter', 'align-center', 'Centrar'], ['justifyRight', 'align-right', 'Derecha']].map(([c, i, t]) => `<button class="icon-btn" data-cmd="${c}" title="${t}" aria-label="${t}">${ic(i)}</button>`).join('')}
      <span class="sep"></span>
      <button class="icon-btn" data-table title="Insertar tabla" aria-label="Insertar tabla">${ic('table')}</button>
      <button class="icon-btn" data-cmd="removeFormat" title="Quitar formato" aria-label="Quitar formato">${ic('remove-formatting')}</button>
      <span class="sep"></span>
      <button class="icon-btn" data-cmd="undo" title="Deshacer" aria-label="Deshacer">${ic('undo-2')}</button>
      <button class="icon-btn" data-cmd="redo" title="Rehacer" aria-label="Rehacer">${ic('redo-2')}</button>
    </div>`;
    const setMode = (on) => {
      editing = on;
      bEdit.classList.toggle('hidden', on); bSave.classList.toggle('hidden', !on); bCancel.classList.toggle('hidden', !on);
      paper().contentEditable = on ? 'true' : 'false';
      if (on) {
        stage.insertAdjacentHTML('afterbegin', toolbarHtml); icons();
        const tb = stage.querySelector('#etb');
        tb.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
        tb.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => { document.execCommand(b.dataset.cmd); paper().focus(); syncTb(); }));
        tb.querySelector('[data-block]').addEventListener('change', (e) => { document.execCommand('formatBlock', false, e.target.value); paper().focus(); });
        tb.querySelector('[data-table]').addEventListener('click', () => {
          document.execCommand('insertHTML', false, '<table><tr><th>Columna 1</th><th>Columna 2</th><th>Columna 3</th></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></table><p><br></p>');
        });
        paper().focus();
      } else stage.querySelector('#etb')?.remove();
    };
    const syncTb = () => stage.querySelectorAll('#etb [data-cmd]').forEach(b => { try { b.classList.toggle('on', document.queryCommandState(b.dataset.cmd)); } catch { } });
    document.addEventListener('selectionchange', () => editing && syncTb());
    bEdit.addEventListener('click', () => setMode(true));
    bCancel.addEventListener('click', () => { paper().innerHTML = original; setMode(false); });
    bSave.addEventListener('click', () => {
      const newHtml = paper().innerHTML;
      if (newHtml === original) { setMode(false); return toast('Sin cambios que guardar', 'info'); }
      const suggested = S.settings.autoVersion ? nextVersion(d.version) : d.version;
      openModal({
        title: 'Guardar cambios', sub: `${esc(d.nomenclatura)} · ${esc(d.nombre)}`,
        body: `<div class="row"><div class="field"><label>Nueva versión</label>${intInput(`id="sv" value="${esc(suggested)}"`)}<div class="hint">Actual: ${esc(d.version)}</div></div>
          <div class="field"><label>Fecha de actualización</label><input class="input" type="date" id="sf" value="${toLocalInput(now()).slice(0, 10)}"/></div></div>
          <div class="field"><label>Descripción del cambio</label><input class="input" id="sn" placeholder="Ej. Se actualizó el alcance" maxlength="140"/></div>`,
        foot: `<button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" data-ok>${ic('save')}Guardar versión</button>`,
        onMount: (c) => c.$('[data-ok]').addEventListener('click', async () => {
          if (!validInt(c.$('#sv').value)) return toast('La versión debe ser un número entero desde 1', 'err');
          const v = intVersion(c.$('#sv').value);
          const key = `hist:${d.id}:${d.history.length}`;
          await Files.put(key, { html: original, orig: null, ext: d.ext, fileName: d.fileName });
          d.history[d.history.length - 1].key = key;
          await Files.put('html:' + d.id, newHtml);
          d.history.push({ v, at: now(), by: me.id, note: c.$('#sn').value.trim() || 'Edición en línea', key: null });
          Object.assign(d, { version: v, fechaActualizacion: c.$('#sf').value, updatedAt: now(), updatedBy: me.id, size: newHtml.length });
          log('edición', `Editó en línea ${d.nomenclatura} → versión ${v}`); save();
          original = newHtml; setMode(false); c.close(); ctx.close(); render();
          toast(`Guardado como versión ${v}`);
          setTimeout(() => openViewer(d), 300);
        }),
      });
    });
  }

  /* ---------------- Descargas ---------------- */
  function downloadMenu(anchor, d, lvl, historyEntry) {
    const items = [{ icon: 'file-text', label: 'Descargar PDF', run: () => downloadDoc(d, 'pdf', historyEntry) }];
    if (lvl === 'editar' || S.settings.downloadFormat === 'original') {
      items.push({ icon: 'file', label: `Archivo original (.${d.ext})`, run: () => downloadDoc(d, 'original', historyEntry) });
      if (d.editable) items.push({ icon: 'file-type', label: 'Word editable (.doc)', run: () => downloadDoc(d, 'word', historyEntry) });
    }
    openMenu(anchor, items);
  }
  const saveBlob = (blob, name) => { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); };
  const safeName = (d) => `${d.nomenclatura} ${d.nombre} ${d.version}`.replace(/[\\/:*?"<>|]+/g, '-');

  async function downloadDoc(d, format = 'original', historyEntry = null) {
    const acc = areaAccess(d.areaId);
    if (LV[acc.level] < 2) return toast('Tu permiso no incluye descargas', 'err');
    if (format !== 'pdf' && format !== 'word' && format !== 'original') format = 'original';
    let html, blob, ext = d.ext, fname = d.fileName;
    if (historyEntry) {
      const h = await Files.get(historyEntry.key);
      html = h?.html; blob = h?.orig; ext = h?.ext || ext;
      if (h?.fileName) fname = h.fileName;
    } else if (format === 'original') {
      if (typeof fetchDocBlob === 'function') {
        const got = await fetchDocBlob(d);
        if (got?.blob) {
          log('descarga', `Descargó ${d.nomenclatura} (ORIGINAL)`); save();
          return saveBlob(got.blob, got.fname || fname || (safeName(d) + (d.ext ? '.' + d.ext : '')));
        }
        return toast('No se encontró el archivo original para descargar', 'err');
      }
      blob = await Files.get('orig:' + d.id);
      html = d.editable ? await Files.get('html:' + d.id) : null;
    } else {
      html = d.editable ? await Files.get('html:' + d.id) : null;
      blob = await Files.get('orig:' + d.id);
    }
    const name = safeName(d);
    log('descarga', `Descargó ${d.nomenclatura} (${String(format).toUpperCase()})`); save();

    if (format === 'original') {
      if (blob instanceof Blob || blob instanceof File) return saveBlob(blob, fname || (name + (ext ? '.' + ext : '')));
      return toast('No se encontró el archivo original para descargar', 'err');
    }
    if (format === 'word') {
      const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>${esc(d.nombre)}</title></head><body>${html || ''}</body></html>`;
      return saveBlob(new Blob(['\ufeff', doc], { type: 'application/msword' }), name + '.doc');
    }
    // PDF
    if (!html && blob && ext === 'pdf') return saveBlob(blob, name + '.pdf');
    let content = html;
    if (!content && blob && ['png', 'jpg', 'jpeg', 'webp'].includes(ext)) {
      const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      content = `<img src="${dataUrl}" style="max-width:100%"/>`;
    }
    if (!content) return toast(`No es posible convertir .${ext} a PDF en el navegador`, 'err');
    if (!window.html2pdf) return toast('El generador de PDF no está disponible', 'err');
    toast('Generando PDF…', 'info');
    const exp = acc.grant?.type === 'temporal' ? acc.grant.expiresAt : null;
    const footer = `${d.nomenclatura} · Versión ${historyEntry ? historyEntry.v : d.version} · Descargado por ${me.email} el ${fmtDateTime(now())}${exp ? ' · Vigencia del acceso: ' + fmtDateTime(exp) : ''}`;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'font-family:Georgia,serif;font-size:11.5pt;line-height:1.55;color:#111;padding:0 2mm';
    wrap.innerHTML = `<style>table{border-collapse:collapse;width:100%;margin:8px 0;font-family:Helvetica,Arial,sans-serif;font-size:9.5pt}td,th{border:1px solid #bbb;padding:4px 6px;vertical-align:top}th{background:#f2f2f2}h1{font-family:Helvetica,Arial,sans-serif;font-size:20pt;margin:10px 0 6px}h2{font-family:Helvetica,Arial,sans-serif;font-size:14pt;margin:14px 0 4px}h3{font-family:Helvetica,Arial,sans-serif}p{margin:0 0 8px}ul,ol{margin:0 0 8px;padding-left:24px}li{margin-bottom:3px}img{max-width:100%}tr,img{page-break-inside:avoid}</style>${content}`;
    const wmText = S.settings.watermark && acc.level !== 'editar' ? me.email : null;
    await html2pdf().set({
      margin: [16, 14, 18, 14], filename: name + '.pdf', image: { type: 'jpeg', quality: 0.96 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'letter', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] },
    }).from(wrap).toPdf().get('pdf').then(pdf => {
      const n = pdf.internal.getNumberOfPages();
      const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
      for (let i = 1; i <= n; i++) {
        pdf.setPage(i);
        if (wmText) { pdf.setFontSize(30); pdf.setTextColor(225, 225, 230); pdf.text(wmText, W / 2 - 55, H / 2 + 30, { angle: 35 }); }
        pdf.setFontSize(7.5); pdf.setTextColor(130); pdf.text(footer, 14, H - 8, { maxWidth: W - 40 }); pdf.text(`${i}/${n}`, W - 20, H - 8);
      }
      saveBlob(pdf.output('blob'), name + '.pdf');
    });
  }

  /* ---------------- Descarga masiva (ZIP) ---------------- */
  async function ensureJSZip() {
    if (window.JSZip) return window.JSZip;
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';

  async function fetchDocBlob(d) {
    // 1) Storage vía Files
    let blob = await Files.get('orig:' + d.id);
    if (blob instanceof Blob || blob instanceof File) return { blob, fname: d.fileName || (safeName(d) + (d.ext ? '.' + d.ext : '')) };
    // 2) URL pública de Supabase / URL del documento
    const candidates = [];
    try { if (Files.publicUrl) candidates.push(Files.publicUrl('orig:' + d.id)); } catch (e) {}
    if (d.url && /^https?:\/\//i.test(d.url)) candidates.push(d.url);
    for (const url of candidates) {
      try {
        const r = await fetch(url, { mode: 'cors' });
        if (r.ok) {
          const b = await r.blob();
          if (b && b.size > 0) return { blob: b, fname: d.fileName || (safeName(d) + (d.ext ? '.' + d.ext : '')) };
        }
      } catch (e) {}
    }
    // 3) HTML editable
    let html = await Files.get('html:' + d.id);
    if (typeof html === 'string' && html) {
      return { blob: new Blob([html], { type: 'text/html;charset=utf-8' }), fname: safeName(d) + '.html' };
    }
    return null;
  }
  async function downloadDocsBulk(docs, zipBaseName = 'documentos') {
    const all = (docs || []).filter(Boolean);
    if (!all.length) return toast('No hay documentos en este alcance', 'err');
    const list = all.filter(d => {
      const lv = areaAccess(d.areaId).level;
      return lv && LV[lv] >= 2;
    });
    if (!list.length) return toast('No hay documentos con permiso de descarga en este alcance', 'err');
    toast(`Preparando ${list.length} documento${list.length === 1 ? '' : 's'}…`);
    try {
      await ensureJSZip();
      const zip = new JSZip();
      let n = 0;
      const used = new Set();
      for (const d of list) {
        const got = await fetchDocBlob(d);
        if (!got || !got.blob) continue;
        let path = got.fname || (safeName(d) + '.bin');
        // carpeta lógica en el ZIP: área/departamento
        const a = areaById(d.areaId);
        const f = folderById(d.folderId);
        const folderPath = [a?.name, f?.name].filter(Boolean).map(s => String(s).replace(/[\\/:*?"<>|]/g, '_')).join('/');
        path = (folderPath ? folderPath + '/' : '') + path;
        if (used.has(path) || zip.file(path)) path = (folderPath ? folderPath + '/' : '') + (d.nomenclatura || d.id) + '_' + (got.fname || 'doc');
        used.add(path);
        zip.file(path, got.blob);
        n++;
      }
      if (!n) return toast('No se pudieron obtener los archivos (revisa Storage o permisos)', 'err');
      const out = await zip.generateAsync({ type: 'blob' });
      const stamp = new Date().toISOString().slice(0, 10);
      saveBlob(out, `${zipBaseName}-${stamp}.zip`);
      log('descarga', `Descarga masiva: ${n} documento(s) (${zipBaseName})`);
      save();
      toast(`${n} documento${n === 1 ? '' : 's'} descargado${n === 1 ? '' : 's'}`);
    } catch (e) {
      console.error(e);
      toast('No se pudo generar la descarga masiva', 'err');
    }
  }

  function genPassword() {
    const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const lower = 'abcdefghijkmnpqrstuvwxyz';
    const nums = '23456789';
    const special = '!@#$%&*?';
    const all = upper + lower + nums + special;
    const rnd = (n) => crypto.getRandomValues(new Uint32Array(n));
    const pick = (s, r) => s[r % s.length];
    const r = rnd(12);
    const chars = [pick(upper, r[0]), pick(lower, r[1]), pick(nums, r[2]), pick(special, r[3])];
    for (let i = 4; i < 12; i++) chars.push(pick(all, r[i]));
    for (let i = chars.length - 1; i > 0; i--) {
      const j = rnd(1)[0] % (i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    return chars.join('');
  }

        const roleHint = () => { const r = S.roles.find(x => x.id === f.role.value); c.$('#roleHint').textContent = r?.desc || ''; };
        f.role.addEventListener('change', () => { roleHint(); summary(); }); roleHint();
        c.$('[data-eye]').addEventListener('click', (e) => togglePass(e.currentTarget, f.pass));
        c.$('[data-gen]').addEventListener('click', () => { f.pass.value = genPassword(); f.pass.type = 'text'; c.$('[data-eye]').innerHTML = ic('eye-off'); icons(); });
        c.$('[data-all]').addEventListener('click', () => { const boxes = c.$$('[name=areas]'); const all = boxes.every(b => b.checked); boxes.forEach(b => b.checked = !all); summary(); });
        f.email.addEventListener('input', () => {
          let v = f.email.value;
          if (v.includes('@')) {
            const [u, dmn] = v.split('@'); f.email.value = u;
            if (dmn && doms.includes(dmn.toLowerCase())) f.domain.value = dmn.toLowerCase();
            else if (dmn) { badDom = true; c.$('#gEmailHint').innerHTML = `<span style="color:var(--danger)">"@${esc(dmn)}" no es un dominio configurado; elige uno de la lista</span>`; }
          }
          f.email.value = f.email.value.toLowerCase().replace(/[^a-z0-9._-]/g, '');
          if (!badDom) emailHint(); badDom = false; summary();
        });
        let badDom = false;
        f.domain.addEventListener('change', () => { emailHint(); summary(); });
        function emailHint() {
          const ex = S.users.find(u => u.email === f.email.value + '@' + f.domain.value);
          if (ex && isNew) c.$('#gEmailHint').innerHTML = `<span style="color:var(--warn)">Cuenta existente (${esc(ex.name)}): se actualizarán sus accesos</span>`;
          else if (doms.length) c.$('#gEmailHint').textContent = 'Solo se muestran los dominios configurados';
        }
        c.$('[data-go-domains]')?.addEventListener('click', () => { c.close(); go('settings', { tab: 'general' }); });
        if (!doms.length) c.$('[data-save]').disabled = true;
        const tempBox = c.$('#tempBox');
        c.$$('[name=type]').forEach(r => r.addEventListener('change', () => { tempBox.classList.toggle('open', f.type.value === 'temporal'); summary(); }));
        c.$$('[data-h]').forEach(b => b.addEventListener('click', () => { f.exp.value = toLocalInput(now() + (+b.dataset.h) * 3600e3); c.$$('[data-h]').forEach(x => x.classList.toggle('on', x === b)); summary(); }));
        f.exp.addEventListener('change', summary);
        c.$$('[name=areas],[name=levels]').forEach(x => x.addEventListener('change', summary));
        c.$$('[data-revoke]').forEach(b => b.addEventListener('click', () => { revokeGrant(b.dataset.revoke); b.closest('.grant').style.opacity = .35; b.remove(); }));
        function selectedLevels() { return c.$$('[name=levels]:checked').map(x => x.value); }
        function effectiveLevel(role) {
          const hi = highestLevel(selectedLevels());
          return hi || roleDefaultLevel(role);
        }
        function summary() {
          const areas = c.$$('[name=areas]:checked').map(x => areaById(x.value).name);
          const r = S.roles.find(x => x.id === f.role.value);
          const lv = effectiveLevel(r);
          const explicit = selectedLevels().length > 0;
          const tp = f.type.value;
          const exp = new Date(f.exp.value).getTime();
          c.$('#expHint').textContent = tp === 'temporal' && exp > now() ? `Expira en ${fmtLeft(exp - now())}. Después no podrá abrir los documentos.` : '';
          const lh = c.$('#levelHint');
          if (lh) lh.textContent = explicit
            ? `Nivel especial asignado: ${LV_LABEL[lv]} (prevalece sobre el perfil).`
            : `Sin selección: se usará el del perfil (${LV_LABEL[roleDefaultLevel(r)]} · ${r?.name || ''}).`;
          const who = f.email.value && doms.length ? `${f.email.value}@${f.domain.value}` : 'El usuario';
          c.$('#summary').innerHTML = r?.caps.allAreas ? `${ic('shield-check')} <b>${esc(who)}</b> tendrá acceso total por su perfil ${esc(r.name)}.`
            : areas.length ? `<b>${esc(who)}</b> podrá <b>${LV_LABEL[lv].toLowerCase()}</b>${explicit ? ' (especial)' : ' (perfil)'} en ${areas.map(esc).join(', ')} — ${tp === 'temporal' ? `hasta el ${fmtDateTime(exp)}` : 'de forma permanente (revocable)'}`
              : curGrants.length ? 'Selecciona áreas para agregar o actualizar accesos, o guarda para conservar los actuales.' : 'Selecciona al menos un área.';
          icons();
        }
        summary();
        c.$('[data-save]').addEventListener('click', async () => {
          const local = f.email.value.trim().toLowerCase();
          if (!doms.length) return toast('Configura al menos un dominio de correo en Configuración → General', 'err');
          const dmn = f.domain.value;
          if (!doms.includes(dmn)) return toast('Elige un dominio configurado', 'err');
          const email = `${local}@${dmn}`;
          if (!local || !/^[a-z0-9._-]+$/.test(local)) { f.email.classList.add('invalid'); return toast('Escribe un nombre de usuario válido', 'err'); }
          let u = user || S.users.find(x => x.email === email);
          if (user && email !== user.email && S.users.some(x => x.email === email)) { f.email.classList.add('invalid'); return toast('Ya existe otra cuenta con ese correo', 'err'); }
          const pass = f.pass.value;
          if (!u) { const e = passPolicyError(pass, st.minPassword); if (e) { f.pass.classList.add('invalid'); return toast(e, 'err'); } }
          if (u && pass) { const e = passPolicyError(pass, st.minPassword); if (e) { f.pass.classList.add('invalid'); return toast(e, 'err'); } }
          const areas = c.$$('[name=areas]:checked').map(x => x.value);
          const role = S.roles.find(x => x.id === f.role.value);
          if (!role) return toast('Selecciona un perfil', 'err');
          if (!areas.length && !role.caps.allAreas && !curGrants.length && !u) return toast('Selecciona al menos un área', 'err');
          const type = f.type.value; const expiresAt = type === 'temporal' ? new Date(f.exp.value).getTime() : null;
          if (type === 'temporal' && (!expiresAt || expiresAt <= now())) { f.exp.classList.add('invalid'); return toast('La fecha de expiración debe ser futura', 'err'); }
          if (u && !keepsAdmin(S.users.map(x => x.id === u.id ? { ...x, role: role.id } : x))) return toast(ADMIN_MSG, 'err');
          const name = f.name.value.trim() || local.replace(/[._-]+/g, ' ').replace(/\b\w/g, m => m.toUpperCase());
          if (!u) {
            u = { id: Repo.uid('u_'), email, name, role: role.id, pass: await Repo.hashPassword(pass), active: true, createdAt: now(), createdBy: me.id, roleHistory: [] };
            S.users.push(u);
            log('usuario', `Creó la cuenta ${email}`);
          } else {
            const oldEmail = u.email;
            const oldRole = u.role;
            u.email = email;
            u.name = name;
            if (oldRole !== role.id) {
              u.roleHistory = Array.isArray(u.roleHistory) ? u.roleHistory : [];
              u.roleHistory.push({ role: oldRole, at: now(), by: me.id });
              log('usuario', `Cambió el perfil de ${email}: ${S.roles.find(r => r.id === oldRole)?.name || oldRole} → ${role.name}`);
            }
            u.role = role.id;
            if (pass) u.pass = await Repo.hashPassword(pass);
            log('usuario', `Actualizó la cuenta ${email}${oldEmail !== email ? ` (antes ${oldEmail})` : ''}${pass ? ' y su contraseña' : ''}`);
          }
          const lvl = effectiveLevel(role);
          const explicit = selectedLevels().length > 0;
          // Sustituye permisos de las áreas marcadas (sin exigir revocar antes)
          if (areas.length) {
            for (const aid of areas) {
              S.grants.filter(g => g.userId === u.id && g.areaId === aid && !g.revoked).forEach(g => {
                g.revoked = true; g.revokedAt = now(); g.revokedBy = me.id; g.replaced = true;
              });
              S.grants.push({
                id: Repo.uid('g_'), userId: u.id, areaId: aid, level: lvl, levelOverride: explicit,
                type, expiresAt, revoked: false, createdAt: now(), createdBy: me.id,
              });
            }
            // Áreas que tenía y se desmarcaron: se revocan (cambio de permisos)
            const kept = new Set(areas);
            S.grants.filter(g => g.userId === u.id && !g.revoked && !kept.has(g.areaId)).forEach(g => {
              g.revoked = true; g.revokedAt = now(); g.revokedBy = me.id; g.replaced = true;
            });
            log('permiso', `Actualizó accesos de ${email}: ${LV_LABEL[lvl].toLowerCase()}${explicit ? ' (especial)' : ' (perfil)'} · ${type} · ${areas.map(x => areaById(x)?.name).join(', ')}`);
          }
          save(); c.close(); render(); toast(isNew ? 'Permisos guardados' : 'Cuenta y accesos actualizados');
        })
      },
    });
  }

  function grantLine(g, inModal = false) {
    const a = areaById(g.areaId); const st = grantStatus(g);
    const stChip = st === 'vigente' ? (g.type === 'temporal' ? `<span class="chip ${g.expiresAt - now() < 864e5 ? 'warn' : 'ok'}">${ic('timer')}${fmtLeft(g.expiresAt - now())}</span>` : `<span class="chip ok">${ic('infinity')}Permanente</span>`)
      : st === 'expirado' ? `<span class="chip danger">${ic('clock')}Expiró ${fmtRel(g.expiresAt)}</span>` : `<span class="chip">${ic('ban')}Revocado</span>`;
    return `<div class="grant"><span class="name">${esc(a?.name || '—')}</span><span class="chip">${ic(LV_ICON[g.level])}${LV_LABEL[g.level]}</span>${stChip}
      ${st !== 'revocado' ? `<button type="button" class="x" ${inModal ? `data-revoke="${g.id}"` : `data-act-revoke="${g.id}"`} title="Revocar acceso" aria-label="Revocar">${ic('x')}</button>` : ''}</div>`;
  }
  function revokeGrant(id) {
    const g = S.grants.find(x => x.id === id); if (!g) return;
    g.revoked = true; g.revokedAt = now(); g.revokedBy = me.id;
    log('permiso', `Revocó el acceso de ${userById(g.userId)?.email} a ${areaById(g.areaId)?.name}`); save();
    toast('Acceso revocado');
  }

  function myAccessModal() {
    const gs = S.grants.filter(g => g.userId === me.id).sort((a, b) => b.createdAt - a.createdAt);
    openModal({
      title: 'Mis accesos', sub: `${esc(me.email)} · ${esc(roleOf().name)}`,
      body: can('allAreas') ? `<p class="muted">Tu perfil tiene acceso total a todas las áreas.</p>` : gs.length ? `<div class="grants">${gs.map(g => grantLine(g, true).replace(/<button[^>]*data-revoke[^>]*>[\s\S]*?<\/button>/, '')).join('')}</div>` : '<p class="muted">No tienes accesos asignados.</p>',
      foot: '<button class="btn btn-primary" data-close>Listo</button>',
    });
  }
  function changePassModal() {
    openModal({
      title: 'Cambiar contraseña', sub: esc(me.email),
      body: `<div class="field"><label>Contraseña actual</label>${passField('p0', 'autocomplete="current-password"')}</div>
        <div class="field"><label>Nueva contraseña ${passTipHtml()}</label>${passField('p1', 'autocomplete="new-password"')}</div>
        <div class="field"><label>Confirmar nueva contraseña</label>${passField('p2', 'autocomplete="new-password"')}</div>`,
      foot: `<button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" data-ok>Actualizar</button>`,
      onMount: (c) => {
        bindPassToggles(c.el);
        c.$('[data-ok]').addEventListener('click', async () => {
        if (!(await Repo.verifyPassword(c.$('#p0').value, me.pass))) return toast('La contraseña actual no coincide', 'err');
        const polErr = passPolicyError(c.$('#p1').value, S.settings.minPassword);
        if (polErr) return toast(polErr, 'err');
        if (c.$('#p1').value !== c.$('#p2').value) return toast('Las contraseñas no coinciden', 'err');
        me.pass = await Repo.hashPassword(c.$('#p1').value); log('usuario', 'Cambió su contraseña'); save(); c.close(); toast('Contraseña actualizada');
      });
      },
    });
  }

  /* ---------------- Configuración ---------------- */
  const TABS = [
    ['general', 'settings-2', 'General', 'settings'],
    ['docs', 'file-cog', 'Documentos', 'settings'],
    ['repo', 'folders', 'Repositorio', 'settings'],
    ['security', 'shield', 'Seguridad y descargas', 'settings'],
    ['users', 'users', 'Usuarios y permisos', 'managePerms'],
    ['roles', 'id-card', 'Perfiles', 'settings'],
    ['audit', 'scroll-text', 'Bitácora', 'settings'],
    ['data', 'database', 'Datos', 'settings'],
  ];
  function settingsView() {
    const tabs = TABS.filter(t => can(t[3]));
    if (!tabs.length) { route.view = 'home'; return homeView(); }
    if (!tabs.find(t => t[0] === route.tab)) route.tab = tabs[0][0];
    return `<div class="page-title" style="margin-top:36px"><h1>Configuración</h1></div>
      <p class="page-sub">Ajusta el comportamiento de ${esc(S.settings.appName)}: reglas de documentos, seguridad, perfiles y permisos.</p>
      <div class="settings"><nav class="side-nav">${tabs.map(([k, i, l]) => `<button class="${route.tab === k ? 'on' : ''}" data-tab="${k}">${ic(i)}${l}</button>`).join('')}</nav>
      <div id="panel">${panel(route.tab)}</div></div>`;
  }
  const sw = (key, on) => `<label class="switch"><input type="checkbox" data-set="${key}" ${on ? 'checked' : ''}/><span></span></label>`;
  const srow = (title, desc, ctl) => `<div class="set-row"><div class="txt"><strong>${title}</strong><span>${desc}</span></div><div class="ctl">${ctl}</div></div>`;
  function panel(tab) {

    if (tab === 'general') return `<div class="panel"><h3>Identidad</h3><p class="muted">Nombre de la herramienta y de la organización.</p>

        ${srow('API key Gemini', 'Se guarda en este navegador / estado de la app. Déjala vacía para solo búsqueda local.', `<input class="input mono" data-set="geminiApiKey" type="password" value="${esc(st.geminiApiKey || '')}" placeholder="AIza… (opcional)" autocomplete="off"/>`)}
        ${srow('Modelo Gemini', 'Ej. gemini-3.5-flash-lite (recomendado free) o gemini-3.5-flash', `<input class="input mono" data-set="geminiModel" value="${esc(st.geminiModel || 'gemini-3.5-flash-lite')}"/>`)}
      </div>
      <div class="panel"><h3>Logo y tipografía del encabezado</h3><p class="muted">Puedes subir un logo para modo claro y otro para modo oscuro. Si solo hay uno, se usa en ambos. El encabezado crece con el tamaño del logo.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:16px">
          <div class="logo-upload-row">

          </div>
        </div>
        <div class="hint" style="margin-bottom:12px">PNG, JPG o WebP. Se ajusta a 256×256 px manteniendo proporción.</div>
        ${srow('Tamaño del logo', 'Ancho y alto en la barra (16–128 px). El encabezado se agranda con el logo', `<div style="display:flex;align-items:center;gap:10px;width:100%"><input type="range" min="16" max="128" step="1" data-set="logoSize" value="${st.logoSize || 28}" style="flex:1"/><span class="mono tiny" id="logoSizeVal">${st.logoSize || 28} px</span></div>`)}
        ${srow('Tamaño del nombre', 'Texto de la herramienta (p. ej. Cyper)', `<div style="display:flex;align-items:center;gap:10px;width:100%"><input type="range" min="12" max="48" step="1" data-set="titleSize" value="${st.titleSize || 17}" style="flex:1"/><span class="mono tiny" id="titleSizeVal">${st.titleSize || 17} px</span></div>`)}
        ${srow('Tamaño de la organización', 'Texto secundario (p. ej. CSW)', `<div style="display:flex;align-items:center;gap:10px;width:100%"><input type="range" min="10" max="32" step="1" data-set="orgSize" value="${st.orgSize || 13}" style="flex:1"/><span class="mono tiny" id="orgSizeVal">${st.orgSize || 13} px</span></div>`)}
      </div>
      <div class="panel" id="domainsPanel"><h3>Dominios de correo permitidos</h3><p class="muted">Solo con estos dominios se pueden crear usuarios y asignar contraseñas; son los únicos que aparecen en el modal de permisos.</p>
        <div class="cat-chips" style="margin-bottom:12px">${st.domains.map(d => { const n = S.users.filter(u => u.email.endsWith('@' + d)).length; return `<span class="chip">@${esc(d)} <span class="tiny">(${n} ${n === 1 ? 'usuario' : 'usuarios'})</span><button class="x" data-dom-del="${esc(d)}" aria-label="Quitar ${esc(d)}">${ic('x')}</button></span>`; }).join('') || '<span class="tiny" style="color:var(--warn)">Aún no hay dominios. Agrega uno para poder crear usuarios.</span>'}</div>
        <div style="display:flex;gap:8px"><div class="input-affix" style="flex:1"><input class="input" id="domAdd" placeholder="empresa.com" style="padding-left:30px;height:38px" autocomplete="off"/><span class="affix" style="left:14px;right:auto">@</span></div>
          <button class="btn btn-secondary btn-sm" style="height:38px" id="domAddBtn">${ic('plus')}Agregar dominio</button></div></div>`;
    if (tab === 'docs') return `<div class="panel"><h3>Nomenclatura</h3><p class="muted">Cómo se extrae automáticamente del nombre del archivo.</p>
      <div class="field"><label>Expresión regular (el primer grupo es la nomenclatura)</label><input class="input mono" data-set="nomenRegex" value="${esc(st.nomenRegex)}"/></div>

      <div class="panel"><h3>Versiones</h3><p class="muted">Control de versiones al subir y editar.</p>

      ${srow('Incrementar versión al editar', 'Sugiere la siguiente versión entera (1 → 2 → 3) al guardar cambios en línea', sw('autoVersion', st.autoVersion))}
      </div>
      <div class="panel"><h3>Catálogos</h3><p class="muted">Opciones de los desplegables. Se llenan solos al capturar un valor nuevo; aquí puedes agregarlos o quitarlos.</p>
      <div class="field"><span class="label">Tipos de documento por categoría</span>
        ${CATEGORIAS.map(c => `<div class="tipo-group"><div class="tg-head">${catChip(c)}<span class="tiny">${CAT_LEVEL[c]}${c === 'Operativo' ? ' · rector opcional (1er nivel)' : c === 'Soporte' ? ' · rector opcional' : ''}</span></div>
          <div class="cat-chips">${S.catalogs.tipos.filter(t => t.cat === c).map(t => `<span class="chip">${esc(t.name)} <span class="tiny mono">${esc(t.code||'')}</span> <span class="tiny">(${S.docs.filter(d => d.tipo === t.name).length})</span><button class="x" data-tipo-rename="${esc(t.name)}" title="Renombrar" aria-label="Renombrar">${ic('pencil')}</button><button class="x" data-tipo-del="${esc(t.name)}" aria-label="Quitar ${esc(t.name)}">${ic('x')}</button></span>`).join('') || '<span class="tiny">Sin tipos</span>'}</div></div>`).join('')}
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input class="input" id="tipoAddName" placeholder="Nuevo tipo de documento" maxlength="50" style="height:38px;flex:1;min-width:180px"/>
          <select class="select" id="tipoAddCat" style="height:38px;width:auto">${CATEGORIAS.map(c => `<option value="${c}">${CAT_LEVEL[c]} · ${c}</option>`).join('')}</select>
          <button class="btn btn-secondary btn-sm" style="height:38px" id="tipoAddBtn">${ic('plus')}Agregar</button></div></div>

  const AUDIT_IC = { acceso: 'log-in', área: 'layout-grid', carpeta: 'folder', documento: 'file-text', edición: 'pencil-line', descarga: 'download', consulta: 'eye', permiso: 'key-round', usuario: 'user', sistema: 'cpu', configuración: 'settings' };

  }

  function bindSettings() {
    $$('[data-tab]').forEach(b => b.addEventListener('click', () => { route.tab = b.dataset.tab; render(); }));
    const P = $('#panel');
    let saveT;
    $$('[data-set]', P).forEach(el => el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => {
      const k = el.dataset.set;
      let v = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Math.max(+el.min || 0, +el.value || 0) : el.value;
      if (k === 'minPassword') { v = Math.max(8, Math.min(32, +v || 8)); el.value = v; }
      if (k === 'versionInicial') { if (!validInt(v)) return; v = intVersion(v); }
      if (k === 'logoSize') { v = Math.max(16, Math.min(128, +v || 28)); const lab = $('#logoSizeVal', P); if (lab) lab.textContent = v + ' px'; }
      if (k === 'titleSize') { v = Math.max(12, Math.min(48, +v || 17)); const lab = $('#titleSizeVal', P); if (lab) lab.textContent = v + ' px'; }
      if (k === 'orgSize') { v = Math.max(10, Math.min(32, +v || 13)); const lab = $('#orgSizeVal', P); if (lab) lab.textContent = v + ' px'; }
      S.settings[k] = v;
      if (['logoSize', 'titleSize', 'orgSize'].includes(k)) applyBrandSizes();
      clearTimeout(saveT);
      saveT = setTimeout(() => { save(); log('configuración', `Cambió “${k}”`); save(); toast('Configuración guardada'); if (k === 'theme') { applyTheme(); render(); } if (['appName', 'orgName', 'logoSize', 'titleSize', 'orgSize', 'repoUnitLabel', 'repoUnitCreate', 'repoAreaLabel', 'repoAreaCreate', 'repoDeptLabel', 'repoDeptCreate'].includes(k)) { const a = document.activeElement; const was = a?.dataset?.set; render(); if (was) { const el2 = $(`[data-set="${was}"]`); if (el2) { el2.focus(); if (el2.type !== 'range' && el2.setSelectionRange) el2.setSelectionRange(el2.value.length, el2.value.length); } } } }, 600);
      if (k === 'nomenRegex') rxTest();
    }));
    // Logo upload
    const resizeLogo = (file) => new Promise((res, rej) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 256;
        let w = img.width, h = img.height;
        if (w > max || h > max) { const s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(canvas.toDataURL('image/png'));
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
      img.src = url;
    });
    const bindLogoSlot = (pickId, fileId, resetId, key, label) => {
      $(pickId, P)?.addEventListener('click', () => $(fileId, P)?.click());
      $(fileId, P)?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0]; if (!file) return;
        if (!file.type.startsWith('image/')) return toast('Selecciona una imagen', 'err');
        if (file.size > 5 * 1048576) return toast('La imagen no debe superar 5 MB', 'err');
        try {
          const data = await resizeLogo(file);
          S.settings[key] = data;
          log('configuración', `Actualizó el logo (${label})`);
          save(); applyTheme(); applyLogoFavicon(); applyBrandSizes(); render(); toast(`Logo ${label} actualizado`);
        } catch (err) { toast(err.message || 'No se pudo procesar la imagen', 'err'); }
        e.target.value = '';
      });
      $(resetId, P)?.addEventListener('click', async () => {
        if (!S.settings[key]) return;
        if (!await confirmDialog({ title: `¿Quitar logo ${label}?`, text: 'Se eliminará este logo del encabezado y del acceso.', ok: 'Quitar', danger: true })) return;
        S.settings[key] = null;
        log('configuración', `Quitó el logo (${label})`);
        save(); applyTheme(); applyLogoFavicon(); render(); toast(`Logo ${label} eliminado`);
      });
    };
    bindLogoSlot('#logoPickLight', '#logoFileLight', '#logoResetLight', 'logoData', 'claro');
    bindLogoSlot('#logoPickDark', '#logoFileDark', '#logoResetDark', 'logoDataDark', 'oscuro');

    const rxTest = () => {
      const t = $('#rxTest'); if (!t) return;
      let out;
      try { new RegExp(S.settings.nomenRegex); const p = parseFileName(t.value, null); out = `Nomenclatura: <b class="mono">${esc(p.nomenclatura || '— (se sugerirá con códigos de área y carpeta)')}</b> · Nombre: <b>${esc(p.nombre)}</b>${p.version ? ` · Versión: <b>${esc(p.version)}</b>` : ''}`; }
      catch { out = '<span style="color:var(--danger)">Expresión regular inválida</span>'; }
      $('#rxOut').innerHTML = out;
    };
    $('#rxTest')?.addEventListener('input', rxTest); rxTest();
    $$('[data-cat-del]', P).forEach(b => b.addEventListener('click', async () => {
      const [k, v] = b.dataset.catDel.split('|');
      const used = S.docs.filter(d => (k === 'macroprocesos' ? d.macroproceso : d.clasificacion) === v).length;
      if (!(await confirmDestructive(`¿Quitar “${esc(v)}”?`, used ? `Se usa en ${used} documento(s). Se vaciará ese campo en esos documentos.` : 'Se eliminará del catálogo.'))) return;
      S.catalogs[k] = (S.catalogs[k] || []).filter(x => x !== v);
      S.docs.forEach(d => {
