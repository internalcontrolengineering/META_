              p.style.background = colors[i % colors.length];
              p.style.width = p.style.height = (5 + Math.random() * 7) + 'px';
              p.style.animationDelay = (Math.random() * 0.08) + 's';
              layer.appendChild(p);
            }
            document.body.appendChild(layer);
            setTimeout(() => { layer.remove(); resolve(); }, 800);
          });
          const t = setInterval(async () => {
            left--;
            setLeft(left);
            if (left <= 0) {
              clearInterval(t);
              if (!cancelled) {
                c.close();
                await playBurst();
                await Repo.wipe();
                S = null; me = null; SessionStore.removeItem(SESSION);
                applyTheme(); render();
                toast('Aplicación reiniciada de fábrica', 'info');
              }
            }
          }, 1000);
          c.$('#rstUndo').addEventListener('click', () => {
            cancelled = true; clearInterval(t); c.close();
            toast('Reseteo cancelado', 'info');
          });
        },
      });
    });
    // Import/export siguen pidiendo confirmación; import también protegido
    $('[data-import]', P)?.addEventListener('click', async (e) => {
      // leave default - already bound below; we wrap password on actual import confirm
    });
  }

  /* Acciones sobre uno o varios usuarios */
  async function bulkUsers(ids, action) {
    const sel = S.users.filter(u => ids.includes(u.id));
    if (!sel.length) return toast('Selecciona al menos un usuario', 'info');
    const who = sel.length === 1 ? sel[0].email : `${sel.length} usuarios`;
    const includesMe = sel.some(u => u.id === me.id);
    if (action === 'delete' || action === 'deactivate') {
      const after = action === 'delete' ? S.users.filter(u => !ids.includes(u.id)) : S.users.map(u => ids.includes(u.id) ? { ...u, active: false } : u);
      if (!keepsAdmin(after)) return toast(ADMIN_MSG, 'err');
    }
    const cfg = {
      revoke: { t: '¿Revocar todos los accesos?', x: `${esc(who)} dejará de ver todas sus áreas de inmediato.`, ok: 'Revocar' },
      deactivate: { t: '¿Desactivar cuentas?', x: `${esc(who)} no podrá iniciar sesión hasta que se reactive.${includesMe ? ' Tu sesión se cerrará.' : ''}`, ok: 'Desactivar' },
      activate: { t: '¿Activar cuentas?', x: `${esc(who)} podrá volver a iniciar sesión.`, ok: 'Activar' },
      delete: { t: '¿Eliminar cuentas?', x: `Se eliminarán ${esc(who)}, sus contraseñas y todos sus permisos. Esta acción no se puede deshacer.${includesMe ? ' Incluye tu propia cuenta: tu sesión se cerrará.' : ''}`, ok: 'Eliminar' },
    }[action];
    if (!await confirmDialog({ title: cfg.t, text: cfg.x, ok: cfg.ok, danger: action !== 'activate' })) return;
    const stamp = { revoked: true, revokedAt: now(), revokedBy: me.id };
    if (action === 'revoke') S.grants.filter(g => ids.includes(g.userId) && !g.revoked).forEach(g => Object.assign(g, stamp));
    if (action === 'deactivate') sel.forEach(u => u.active = false);
    if (action === 'activate') sel.forEach(u => u.active = true);
    if (action === 'delete') { S.users = S.users.filter(u => !ids.includes(u.id)); S.grants = S.grants.filter(g => !ids.includes(g.userId)); }
    const verb = { revoke: 'Revocó todos los accesos de', deactivate: 'Desactivó', activate: 'Activó', delete: 'Eliminó' }[action];
    log(action === 'revoke' ? 'permiso' : 'usuario', `${verb} ${sel.map(u => u.email).join(', ')}`);
    save();
    if (includesMe && (action === 'delete' || action === 'deactivate')) return logout('Tu cuenta fue ' + (action === 'delete' ? 'eliminada' : 'desactivada'));
    render();
    toast({ revoke: 'Accesos revocados', deactivate: 'Cuentas desactivadas', activate: 'Cuentas activadas', delete: sel.length === 1 ? 'Cuenta eliminada' : `${sel.length} cuentas eliminadas` }[action]);
  }

        <div class="field"><label>Descripción</label><input class="input" id="rd" value="${esc(r?.desc || '')}"/></div>
        ${isNew ? `<div class="field"><label>Copiar capacidades de</label><select class="select" id="rc">${S.roles.map(x => `<option value="${x.id}" ${x.id === 'consulta' ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : ''}`,
      foot: `${!isNew ? `<button class="btn btn-danger left" data-del>Eliminar</button>` : ''}<button class="btn btn-secondary" data-close>Cancelar</button><button class="btn btn-primary" data-ok>Guardar</button>`,

          if (isNew) { const base = S.roles.find(x => x.id === c.$('#rc').value); S.roles.push({ id: Repo.uid('r_'), name, desc: c.$('#rd').value.trim(), caps: { ...base.caps, allAreas: false } }); }
          else Object.assign(r, { name, desc: c.$('#rd').value.trim() });
          log('configuración', `${isNew ? 'Creó' : 'Editó'} el perfil ${name}`); save(); c.close(); render(); toast('Perfil guardado');
        });
        c.$('[data-del]')?.addEventListener('click', () => {
          const n = S.users.filter(u => u.role === r.id).length;
          if (n) return toast(`Hay ${n} usuarios con este perfil; reasígnalos primero`, 'err');
          S.roles = S.roles.filter(x => x.id !== r.id); log('configuración', `Eliminó el perfil ${r.name}`); save(); c.close(); render(); toast('Perfil eliminado');
        });
      },
    });
  }



  /* ---------------- Asistente IA GRATUITO (OCR local + búsqueda) ----------------
     - Sin OpenAI de pago. OCR con Tesseract.js, PDF con pdf.js, DOCX/XLSX ya existentes.
     - Índice de texto en cada documento (campo aiText) + persistencia Repo.
     - Chat: búsqueda por palabras clave en docs con acceso.
     - Opcional: Gemini gratis (pegar API key en Configuración → Asistente IA).
     ------------------------------------------------------------------------------- */
  const CyperAI = {
    history: [],
    busy: false,
    _tess: null,

    getGeminiKey() {
      return (S?.settings?.geminiApiKey || '').trim();
    },

    accessibleAreaIds() {
      if (!me || !S) return [];
      if (can('allAreas')) return S.areas.map(a => a.id);
      return S.areas.filter(a => {
        const ax = areaAccess(a.id);
        return ax && ax.level && ax.status === 'vigente';
      }).map(a => a.id);
    },

    accessibleDocs() {
      const ids = new Set(this.accessibleAreaIds());
      return (S.docs || []).filter(d => ids.has(d.areaId));
    },

    htmlToText(html) {
      if (!html) return '';
      const d = document.createElement('div');
      d.innerHTML = String(html);
      return (d.innerText || d.textContent || '').replace(/\s+/g, ' ').trim();
    },

    async extractPdfText(fileOrBlob) {
      if (!window.pdfjsLib) return '';
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        const buf = await fileOrBlob.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        const parts = [];
        const maxPages = Math.min(pdf.numPages, 40);
        for (let i = 1; i <= maxPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          parts.push(content.items.map(it => it.str).join(' '));
        }
        return parts.join('\n').replace(/\s+/g, ' ').trim();
      } catch (e) {
        console.warn('pdf extract', e);
        return '';
      }
    },

    async extractOcr(fileOrBlob) {
      if (!window.Tesseract) return '';
      try {
        toast('OCR en curso (puede tardar unos segundos)…', 'info');
        const { data } = await Tesseract.recognize(fileOrBlob, 'spa+eng', {
          logger: () => {},
        });
        return (data?.text || '').replace(/\s+/g, ' ').trim();
      } catch (e) {
        console.warn('ocr', e);
        return '';
      }
    },

    async extractText(d, opts = {}) {
      let text = '';
      let html = opts.html;
      try {
        if (!html) {
          const h = await Files.get('html:' + d.id);
          if (typeof h === 'string') html = h;
          else if (h instanceof Blob) html = await h.text();
        }
      } catch (e) {}
      if (html) text = this.htmlToText(html);
      if (text && text.length > 40) return { text, source: 'html' };

      let file = opts.file;
      if (!file) {
        try {
          const b = await Files.get('orig:' + d.id);
          if (b instanceof Blob || b instanceof File) file = b;
        } catch (e) {}
      }
      if (!file) return { text: text || '', source: 'empty' };

      const name = (d.fileName || file.name || '').toLowerCase();
      const mime = (file.type || d.mime || '').toLowerCase();

      if (mime.includes('pdf') || name.endsWith('.pdf')) {
        text = await this.extractPdfText(file);
        if (text && text.length > 40) return { text, source: 'pdf' };
        // PDF escaneado: OCR de las primeras páginas como imagen no es trivial sin canvas;
        // intentar OCR del blob completo no aplica. Devolver lo que haya.
        return { text: text || '', source: 'pdf' };
      }
      if (mime.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|tiff?)$/i.test(name)) {
        text = await this.extractOcr(file);
        return { text, source: 'ocr' };
      }
      if (mime.startsWith('text/') || name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.csv')) {
        text = await file.text();
        return { text: text.replace(/\s+/g, ' ').trim(), source: 'text' };
      }
      // DOCX ya suele venir como html vía convertToHtml
      return { text: text || '', source: 'other' };
    },

    async indexDoc(d, opts = {}) {
      if (!d) return;
      try {
        const { text, source } = await this.extractText(d, opts);
        d.aiText = text || '';
        d.aiSource = source;
        d.aiIndexedAt = Date.now();
        save();
        if (text && text.length > 20) {
          console.info('Indexado (gratis)', d.nomenclatura || d.id, source, text.length, 'chars');
        } else {
          console.warn('Sin texto indexable', d.nomenclatura || d.id, source);
        }
      } catch (e) {
        console.warn('indexDoc free', e);
      }
    },

    tokenize(s) {
      return String(s || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .split(/[^a-z0-9áéíóúñü]+/i)
        .filter(w => w.length > 2);
    },

    scoreDoc(d, terms) {
      const hay = (d.aiText || '') + ' ' + (d.nombre || '') + ' ' + (d.nomenclatura || '') + ' ' + (d.tipo || '');
      const low = hay.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (!low.trim()) return { score: 0, excerpts: [] };
      let score = 0;
      const excerpts = [];
      for (const t of terms) {
        if (!t) continue;
        let idx = 0, hits = 0;
        while ((idx = low.indexOf(t, idx)) !== -1) {
          hits++;
          idx += t.length;
        }
        if (hits) {
          score += hits * (t.length > 5 ? 2 : 1);
          const pos = low.indexOf(t);
          if (pos >= 0) {
            const start = Math.max(0, pos - 80);
            const end = Math.min(hay.length, pos + t.length + 120);
            excerpts.push(hay.slice(start, end).trim());
          }
        }
      }
      // bonus si coincide nomenclatura/nombre
      const title = ((d.nomenclatura || '') + ' ' + (d.nombre || '')).toLowerCase();
      for (const t of terms) if (title.includes(t)) score += 5;
      return { score, excerpts: [...new Set(excerpts)].slice(0, 3) };
    },

    search(question, limit = 8) {
      const terms = this.tokenize(question);
      if (!terms.length) return [];
      const results = [];
      for (const d of this.accessibleDocs()) {
        const { score, excerpts } = this.scoreDoc(d, terms);
        if (score > 0) {
          results.push({
            doc: d,
            score,
            excerpts,
            nomenclatura: d.nomenclatura,
            nombre: d.nombre,
            file_name: d.fileName,
            doc_id: d.id,
            similarity: Math.min(0.99, score / (terms.length * 6)),
          });
        }
      }
      results.sort((a, b) => b.score - a.score);
      return results.slice(0, limit);
    },

    buildLocalAnswer(question, hits) {
      if (!hits.length) {
        return 'No encontré coincidencias en los documentos a los que tienes acceso.\n\nSugerencias:\n• Indexa los documentos (súbelos de nuevo o usa “Reindexar” en el asistente).\n• Prueba con otras palabras clave de la política.';
      }
      const lines = [
        `Encontré ${hits.length} documento(s) relevantes para: “${question}”.\n`,
      ];
      hits.forEach((h, i) => {
        const label = [h.nomenclatura, h.nombre || h.file_name].filter(Boolean).join(' · ') || h.doc_id;
        lines.push(`${i + 1}. ${label}`);
        if (h.excerpts?.length) {
          h.excerpts.forEach(ex => lines.push(`   «…${ex}…»`));
        }
        lines.push('');
      });
      lines.push('Pulsa una cita para abrir el documento.');
      return lines.join('\n');
    },

    async answerWithGemini(question, hits) {
      const key = this.getGeminiKey();
      if (!key) return null;
      const context = hits
        .map((h, i) => {
          const label = [h.nomenclatura, h.nombre].filter(Boolean).join(' ') || h.doc_id;
          const ex = (h.excerpts || []).join('\n');
          const body = ex || (h.doc.aiText || '').slice(0, 1200);
          return `[#${i + 1}] ${label}\n${body}`;
        })
        .join('\n\n---\n\n');
      const prompt =
        'Eres el asistente del repositorio documental Cyper. Responde en español solo con el contexto. ' +
        'Si no está en el contexto, dilo. Cita con [#n] y nomenclatura.\n\n' +
        (context ? `Contexto:\n${context}\n\n` : 'Sin contexto recuperado.\n\n') +
        `Pregunta: ${question}`;
      // Modelo lite con cupo gratuito generoso (revisar límites en AI Studio)
      const model = (S.settings.geminiModel || 'gemini-3.5-flash-lite').trim();
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.2, maxOutputTokens: 1024 },
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data?.error?.message || 'Error Gemini');
      const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '';
      return text.trim() || null;
    },

    open() {
      const p = $('#aiPanel');
      if (!p) return;
      p.classList.remove('hidden');
      icons();
      setTimeout(() => $('#aiInput')?.focus(), 50);
    },
    close() {
      $('#aiPanel')?.classList.add('hidden');
    },
    toggle() {
      const p = $('#aiPanel');
      if (!p) return;
      if (p.classList.contains('hidden')) this.open();
      else this.close();
    },
    clear() {
      this.history = [];
      const box = $('#aiMsgs');
      if (box) {
        box.innerHTML =
          `<div class="ai-empty" id="aiEmpty"><strong>Búsqueda Inteligente en tu Repositorio</strong>Plantea tu duda con tus propias palabras. Olvídate de recordar títulos o términos exactos: solo pregunta y listo.</div>`;
      }
    },
    appendMsg(role, text, citations) {
      const box = $('#aiMsgs');
      if (!box) return;
      $('#aiEmpty')?.remove();
      const el = document.createElement('div');
      el.className = 'ai-msg ' + (role === 'user' ? 'user' : role === 'err' ? 'err' : 'bot');
      el.textContent = text;
      if (citations && citations.length) {
        const cites = document.createElement('div');
        cites.className = 'cites';
        citations.forEach((c, i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'cite';
          const label =
            [c.nomenclatura, c.nombre || c.file_name].filter(Boolean).join(' · ') || c.doc_id;
          b.textContent = `#${i + 1} ${label}`;
          b.title = (c.excerpts && c.excerpts[0]) || '';
          b.addEventListener('click', () => {
            const d = S.docs.find(x => x.id === c.doc_id);
            if (d) openViewer(d);
          });
          cites.appendChild(b);
        });
        el.appendChild(cites);
      }
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    },

    async reindexAll() {
      const docs = this.accessibleDocs();
      if (!docs.length) return toast('No hay documentos accesibles', 'info');
      toast(`Indexando ${docs.length} documento(s)…`, 'info');
      let n = 0;
      for (const d of docs) {
        await this.indexDoc(d);
        n++;
      }
      toast(`Indexados ${n} documento(s)`, 'ok');
    },

    async send() {
      if (this.busy) return;
      const input = $('#aiInput');
      const q = (input?.value || '').trim();
      if (!q) return;
      if (!me) return toast('Inicia sesión para usar el asistente', 'err');
      input.value = '';
      this.appendMsg('user', q);
      this.busy = true;
      $('#aiTyping')?.classList.remove('hidden');
      $('#aiSend')?.setAttribute('disabled', 'true');
      try {
        // Indexar al vuelo los que no tengan texto
        const need = this.accessibleDocs().filter(d => !d.aiText);
        if (need.length && need.length <= 15) {
          for (const d of need) await this.indexDoc(d);
        }
        const hits = this.search(q, 8);
        let answer = null;
        if (this.getGeminiKey()) {
          try {
            answer = await this.answerWithGemini(q, hits);
          } catch (e) {
            console.warn(e);
            answer = null;
            this.appendMsg('err', 'Gemini no disponible: ' + (e.message || e) + '. Uso respuesta local.');
          }
        }
        if (!answer) answer = this.buildLocalAnswer(q, hits);
        this.appendMsg('bot', answer, hits);
        try {
          log('consulta', `IA local: ${q.slice(0, 80)}`);
          save();
        } catch (e) {}
      } catch (e) {
        this.appendMsg('err', String(e.message || e));
      } finally {
        this.busy = false;
        $('#aiTyping')?.classList.add('hidden');
        $('#aiSend')?.removeAttribute('disabled');
        icons();
      }
    },

    bind() {
      const fab = $('#aiFab');
      if (!fab || fab.dataset.bound) return;
      fab.dataset.bound = '1';
      fab.addEventListener('click', () => this.toggle());
      $('#aiClose')?.addEventListener('click', () => this.close());
      $('#aiClear')?.addEventListener('click', () => this.clear());
      $('#aiSend')?.addEventListener('click', () => this.send());
      $('#aiInput')?.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          this.send();
        }
      });
      // botón reindexar si existe
      document.getElementById('aiReindex')?.addEventListener('click', () => this.reindexAll());
    },
    syncFab() {
      const fab = $('#aiFab');
      if (!fab) return;
      if (me && S) fab.classList.remove('hidden');
      else {
        fab.classList.add('hidden');
        this.close();
      }
      this.bind();
      icons();
    },
  };
  window.CyperAI = CyperAI;


  /* ---------------- Arranque ---------------- */

  const sid = SessionStore.getItem(SESSION);
  if (sid && S) { const u = userById(sid); if (u && u.active) me = u; }
  // Si la ruta guardada apunta a algo inexistente, volver a home
  if (me && S) {
    if (route.view === 'unit' && !unitById(route.unitId)) { route.view = 'home'; route.unitId = null; }
    if (route.view === 'area' && !areaById(route.areaId)) { route.view = 'home'; route.areaId = null; }
    if (route.view === 'folder' && !folderById(route.folderId)) { route.view = route.areaId ? 'area' : 'home'; route.folderId = null; }
  } else {
    // Sin sesión: no restaurar ruta
    route.view = 'home'; route.unitId = null; route.areaId = null; route.folderId = null; route.q = '';
  }
  touchSessionActivity();
  startSessionWatch();
  render();
  CyperAI.syncFab();

  // Revalidar accesos temporales cada 30 s (sin perder scroll ni ruta)
  setInterval(() => {
    if (!me || $('#modals').children.length) return;
    if (['unit', 'area', 'folder'].includes(route.view)) {
      const y = scrollY; render(); scrollTo(0, y);
    }
  }, 30000);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => (!S || S.settings.theme === 'auto') && (applyTheme(), render()));
})();
